<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta property="og:description" content="Robotics deployment, technical systems and commercial strategy. Robotics Transformation consultant intern at RLWRLD; Computer Science & Statistics at Penn State; CFA Level II candidate.">
<meta property="og:url" content="https://mzkjack.com/">
<meta property="og:image" content="https://mzkjack.com/images/profile.jpg">
<meta name="twitter:card" content="summary">
<style>

  /* ============================================================
     Design tokens. Everything below draws from these.
     ============================================================ */
  :root {
    color-scheme: light;

    /* colour */
    --bg: #FFFFFF;
    --bg-alt: #F6F7F8;
    --text: #111417;
    --text-2: #4B5563;
    --text-3: #6B7480;
    --accent: #0B7F69;          /* 4.9:1 on white */
    --accent-soft: rgba(11, 127, 105, 0.10);
    --line: #E5E8EB;
    --line-strong: #CBD1D7;
    --focus: #0B7F69;

    /* type */
    --font: "Helvetica Neue", Helvetica, Arial, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    --fs-hero: clamp(30px, 1.6vw + 22px, 40px);
    --fs-h2: 24px;
    --fs-h3: 19px;
    --fs-body: 17px;
    --fs-small: 14px;
    --fs-meta: 13px;
    --lh: 1.6;

    /* space */
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px; --s9: 96px;

    /* layout */
    --content: 1160px;
    --measure: 68ch;
    --gutter: clamp(16px, 4vw, 40px);

    /* shape + motion */
    --r1: 4px; --r2: 8px;
    --t: 160ms;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  /* ============================================================
     Base
     ============================================================ */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { min-width: 320px; scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font); font-size: var(--fs-body); line-height: var(--lh);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  a { color: inherit; text-decoration: none; }
  p a, li a, dd a, .link {
    color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
    text-decoration-color: rgba(11, 127, 105, 0.4); transition: text-decoration-color var(--t) var(--ease);
  }
  p a:hover, li a:hover, dd a:hover, .link:hover { text-decoration-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 2px; }
  ::selection { background: var(--accent-soft); }
  h1, h2, h3 { font-weight: 600; color: var(--text); letter-spacing: -0.012em; text-wrap: balance; }
  h2 { font-size: var(--fs-h2); line-height: 1.3; }
  h3 { font-size: var(--fs-h3); line-height: 1.4; }
  b, strong { font-weight: 600; color: var(--text); }
  img, video { max-width: 100%; display: block; }
  button { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  .measure { max-width: var(--measure); }
  .muted { color: var(--text-2); }
  .meta { font-size: var(--fs-meta); color: var(--text-3); line-height: 1.5; }
  .wrap { width: min(var(--content), calc(100% - 2 * var(--gutter))); margin: 0 auto; }

  /* Skip link: hidden until it takes focus. */
  .skip {
    position: absolute; left: var(--s4); top: -100px; z-index: 100;
    background: var(--text); color: #fff; padding: 10px 14px; border-radius: var(--r1); font-size: var(--fs-small);
  }
  .skip:focus { top: var(--s3); outline-color: #fff; }

  /* ============================================================
     Header
     ============================================================ */
  .site-header {
    position: sticky; top: 0; z-index: 20; background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid transparent; transition: border-color var(--t) var(--ease);
  }
  .site-header.scrolled { border-bottom-color: var(--line); }
  .site-header .wrap { min-height: 56px; display: flex; align-items: center; gap: var(--s5); }
  .brand { font-weight: 600; font-size: 15px; color: var(--text); white-space: nowrap; letter-spacing: 0.01em; padding: 10px 0; }
  .nav { display: flex; gap: var(--s1); margin-left: auto; }
  .nav a {
    display: inline-block; padding: 10px 10px; font-size: var(--fs-small); color: var(--text-2); border-radius: var(--r1);
    transition: color var(--t) var(--ease);
  }
  .nav a:hover { color: var(--text); }
  .nav a[aria-current="true"] { color: var(--text); font-weight: 600; }
  .menu-btn {
    display: none; appearance: none; border: 1px solid var(--line-strong); background: var(--bg); color: var(--text);
    border-radius: var(--r1); padding: 8px 12px; font-size: var(--fs-small); cursor: pointer; min-height: 44px; margin-left: auto;
  }
  .lang-switch { display: inline-flex; flex: 0 0 auto; border: 1px solid var(--line-strong); border-radius: var(--r1); overflow: hidden; }
  .lang-switch button {
    appearance: none; border: 0; background: var(--bg); cursor: pointer; color: var(--text-2);
    font-size: 12px; font-weight: 600; letter-spacing: 0.02em; padding: 7px 10px; min-height: 32px; line-height: 1;
    transition: color var(--t) var(--ease), background var(--t) var(--ease);
  }
  .lang-switch button + button { border-left: 1px solid var(--line-strong); }
  .lang-switch button:hover { color: var(--text); }
  .lang-switch button[aria-pressed="true"] { background: var(--text); color: #fff; }
  .lang-switch button:focus-visible { outline-offset: -3px; }
  .lang-switch[hidden] { display: none; }

  /* ============================================================
     Page sections
     ============================================================ */
  main { flex: 1; }
  .section { padding: var(--s8) 0; border-top: 1px solid var(--line); }
  .section > .wrap { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--s6) var(--s8); align-items: start; }
  .section-head h2 { position: sticky; top: 80px; }
  .section-head p { margin-top: var(--s3); font-size: var(--fs-small); color: var(--text-2); max-width: 24ch; }
  .section-body { min-width: 0; }
  .section-body > p { max-width: var(--measure); }
  .section-body > p + p { margin-top: var(--s4); }
  .intro { color: var(--text-2); max-width: var(--measure); margin-bottom: var(--s6); }

  /* ---- hero ---- */
  .hero { padding: clamp(40px, 7vw, 88px) 0 var(--s8); border-top: 0; }
  .hero .wrap { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s6) var(--s8); align-items: start; }
  .hero-role { font-size: var(--fs-small); color: var(--text-2); }
  .hero h1 { font-size: var(--fs-hero); line-height: 1.12; margin-top: var(--s2); letter-spacing: -0.02em; }
  .hero-statement { font-size: clamp(18px, 0.6vw + 15px, 21px); line-height: 1.5; color: var(--text); margin-top: var(--s5); max-width: 34em; text-wrap: pretty; }
  .hero-cred { margin-top: var(--s4); color: var(--text-2); font-size: var(--fs-small); }
  .hero-actions { display: flex; align-items: center; gap: var(--s5); margin-top: var(--s6); flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px;
    background: var(--text); color: #fff; border-radius: var(--r1); font-size: var(--fs-small); font-weight: 600;
    transition: background var(--t) var(--ease);
  }
  .btn:hover { background: #2A3038; }
  .hero-actions .link { font-size: var(--fs-small); font-weight: 600; min-height: 44px; display: inline-flex; align-items: center; }
  .portrait { width: 132px; height: 132px; border-radius: var(--r2); overflow: hidden; background: var(--bg-alt); }
  .portrait img { width: 100%; height: 100%; object-fit: cover; }

  /* ---- selected work ---- */
  .work-list { list-style: none; border-top: 1px solid var(--line); }
  .work-item { padding: var(--s6) 0; border-bottom: 1px solid var(--line); }
  .work-item .meta { margin-bottom: var(--s2); }
  .work-item h3 { font-size: 21px; }
  .work-item .summary { margin-top: var(--s3); max-width: var(--measure); }
  .work-tags { display: flex; flex-wrap: wrap; gap: 0 var(--s3); margin-top: var(--s3); list-style: none; font-size: var(--fs-meta); color: var(--text-3); }
  .work-tags li + li::before { content: "·"; margin-right: var(--s3); color: var(--line-strong); }
  .disclosure { margin-top: var(--s4); }
  .disclosure > summary {
    list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: var(--s2); min-height: 44px;
    font-size: var(--fs-small); font-weight: 600; color: var(--accent); user-select: none;
  }
  .disclosure > summary::-webkit-details-marker { display: none; }
  .disclosure > summary::before {
    content: ""; width: 7px; height: 7px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
    transform: rotate(-45deg); transition: transform var(--t) var(--ease); margin-top: -2px;
  }
  .disclosure[open] > summary::before { transform: rotate(45deg); }
  .disclosure > summary:hover { text-decoration: underline; text-underline-offset: 3px; }
  .disclosure > .disclosure-body { padding: var(--s2) 0 var(--s2) var(--s4); border-left: 2px solid var(--line); margin-top: var(--s2); max-width: var(--measure); }
  .disclosure-body ul { padding-left: 18px; display: grid; gap: var(--s2); }
  .disclosure-body li::marker { color: var(--text-3); }

  /* ---- experience ---- */
  .roles { list-style: none; }
  .role { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: var(--s2) var(--s6); padding: var(--s5) 0; border-top: 1px solid var(--line); }
  .role:first-child { border-top: 0; padding-top: 0; }
  .role-when { font-size: var(--fs-meta); color: var(--text-3); padding-top: 4px; }
  .role-when .now { color: var(--accent); font-weight: 600; }
  .role h3 { font-size: var(--fs-h3); }
  .role .org { font-size: var(--fs-small); color: var(--text-2); margin-top: 2px; }
  .role .overview { margin-top: var(--s3); max-width: var(--measure); }
  .role ul { margin-top: var(--s3); padding-left: 18px; display: grid; gap: var(--s2); max-width: var(--measure); }
  .role li::marker { color: var(--text-3); }
  .role .disclosure-body ul { margin-top: 0; }
  .roles.earlier { margin-top: var(--s7); }
  .roles.earlier .role { padding: var(--s4) 0; }
  .roles.earlier h3 { font-size: var(--fs-body); font-weight: 600; }
  .roles.earlier .overview, .roles.earlier ul { font-size: var(--fs-small); color: var(--text-2); }
  .earlier-head { font-size: var(--fs-meta); color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; margin: var(--s7) 0 var(--s3); }

  /* ---- facts (outside work, education) ---- */
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--s4) var(--s5); margin-top: var(--s6); padding-top: var(--s5); border-top: 1px solid var(--line); }
  .facts dt { font-size: var(--fs-meta); color: var(--text-3); }
  .facts dd { margin-top: 2px; font-weight: 600; font-size: var(--fs-body); }
  .facts dd small { display: block; font-weight: 400; font-size: var(--fs-meta); color: var(--text-2); margin-top: 1px; }
  .rows { list-style: none; }
  .rows li { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: var(--s2) var(--s5); padding: var(--s3) 0; border-top: 1px solid var(--line); }
  .rows li:first-child { border-top: 0; padding-top: 0; }
  .rows .k { font-size: var(--fs-meta); color: var(--text-3); padding-top: 3px; }
  .rows .v { font-size: var(--fs-small); color: var(--text); }
  .rows .v .sub { color: var(--text-2); }

  /* ---- race archive (secondary by design) ---- */
  .archive { margin-top: var(--s6); }
  .archive .archive-body { border-left: 0; padding: var(--s3) 0 0; max-width: none; }
  .race-list { list-style: none; border-top: 1px solid var(--line); }
  .race { border-bottom: 1px solid var(--line); }
  .race-row { display: flex; align-items: center; gap: var(--s3); padding: 9px 0; min-height: 44px; list-style: none; cursor: pointer; }
  .race-row::-webkit-details-marker { display: none; }
  .race-row::marker { content: ""; }
  .race-row.plain { cursor: default; }
  .race-badge {
    flex: 0 0 auto; width: 52px; font-size: 11px; font-weight: 600; color: var(--text-2); text-align: center;
    border: 1px solid var(--line-strong); border-radius: var(--r1); padding: 3px 0; line-height: 1.2; white-space: nowrap;
  }
  .race-badge.upcoming { border-style: dashed; }
  .race-id { min-width: 0; flex: 1 1 0%; display: flex; align-items: baseline; gap: var(--s2); }
  .race-name { font-size: var(--fs-small); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
  .race-sub { font-size: var(--fs-meta); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
  .race-flag { font-size: 11px; color: var(--text-3); border: 1px dashed var(--line-strong); border-radius: var(--r1); padding: 1px 6px; }
  .race-stats { margin-left: auto; display: flex; gap: var(--s4); white-space: nowrap; font-size: var(--fs-meta); color: var(--text-2); }
  .race-stats b { font-weight: 600; color: var(--text); }
  .race-stats i { font-style: normal; color: var(--text-3); }
  .race-chev { flex: 0 0 auto; width: 7px; height: 7px; border-right: 1.5px solid var(--text-3); border-bottom: 1.5px solid var(--text-3); transform: rotate(-45deg); transition: transform var(--t) var(--ease); margin-right: 3px; }
  .race-x[open] > .race-row .race-chev { transform: rotate(45deg); }
  .race-more { padding: 0 0 var(--s4); }
  .race-note { padding: var(--s2) 0 var(--s3); color: var(--text-2); font-size: var(--fs-small); max-width: var(--measure); }
  .race-map { margin-top: var(--s2); }
  .race-map .media-cell { aspect-ratio: 21 / 9; max-height: 180px; border-radius: var(--r2); overflow: hidden; }
  .race-map .map-tag { position: absolute; left: 8px; top: 8px; z-index: 1; background: rgba(255,255,255,0.92); color: var(--text-2); font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: var(--r1); }
  .race-tools { display: flex; justify-content: flex-end; margin: 0 0 var(--s2); }
  .race-toggle-all { appearance: none; border: 0; background: none; cursor: pointer; font-size: var(--fs-meta); color: var(--text-2); padding: 8px 0; min-height: 44px; }
  .race-toggle-all:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
  .race-summary, .race-tally, .tally, .tally-head, .race-next, .race-record { display: none; }

  /* ---- media cells shared by races and posts ---- */
  .media-cell { position: relative; display: block; width: 100%; margin: 0; padding: 0; border: 0; background: var(--bg-alt); overflow: hidden; cursor: zoom-in; }
  .media-cell img, .media-cell video { width: 100%; height: 100%; object-fit: cover; }
  .media-cell .play { position: absolute; inset: 0; margin: auto; width: 44px; height: 44px; border-radius: 50%; background: rgba(17,20,23,0.7); color: #fff; display: grid; place-items: center; font-size: 14px; padding-left: 3px; pointer-events: none; }
  .media-more { position: absolute; inset: 0; background: rgba(17,20,23,0.5); color: #fff; display: grid; place-items: center; font-size: 18px; font-weight: 600; }
  .post-media { display: grid; gap: 2px; border-radius: var(--r2); overflow: hidden; margin-top: var(--s3); }
  .post-media.n-1 { grid-template-columns: 1fr; }
  .post-media.n-2, .post-media.n-4 { grid-template-columns: 1fr 1fr; }
  .post-media.n-3 { grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; }
  .post-media.n-3 .media-cell:first-child { grid-row: span 2; }
  .post-media .media-cell { aspect-ratio: 4 / 3; max-height: 260px; }

  /* Photo strip (races): one shared height, natural widths. */
  .carousel { position: relative; --strip-h: clamp(180px, 22vw, 280px); margin-top: var(--s3); }
  .carousel .track { display: flex; align-items: flex-start; gap: var(--s2); overflow-x: auto; overflow-y: hidden; scroll-snap-type: x proximity; scroll-behavior: smooth; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding-bottom: 2px; scroll-padding-inline: 0; }
  .carousel .track::-webkit-scrollbar { display: none; }
  .carousel .track:focus-visible { outline-offset: 2px; }
  .carousel .slide { flex: 0 0 auto; width: auto; height: var(--strip-h); position: relative; display: block; margin: 0; padding: 0; border: 0; background: var(--bg-alt); border-radius: var(--r2); overflow: hidden; }
  .carousel .slide.media-cell { cursor: zoom-in; }
  .carousel .slide img, .carousel .slide video { height: var(--strip-h); width: auto; max-width: none; object-fit: cover; }
  .carousel .slide-cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 8px; color: #fff; font-size: 12px; line-height: 1.4; background: linear-gradient(to top, rgba(17,20,23,0.7), transparent); }
  .carousel .c-nav { position: absolute; top: 50%; margin-top: -18px; width: 36px; height: 36px; border-radius: 50%; appearance: none; border: 1px solid var(--line-strong); cursor: pointer; color: var(--text); background: rgba(255,255,255,0.96); display: grid; place-items: center; font-size: 16px; line-height: 1; opacity: 0; transition: opacity var(--t) var(--ease); }
  .carousel:hover .c-nav, .carousel .c-nav:focus-visible { opacity: 1; }
  .carousel .c-nav[disabled], .carousel.fits .c-nav { display: none; }
  .carousel .c-nav.prev { left: 8px; } .carousel .c-nav.next { right: 8px; }
  @media (hover: none) { .carousel .c-nav { display: none; } }

  /* ---- updates feed (only when posts exist) ---- */
  .feed { display: grid; gap: var(--s6); }
  .post { padding-bottom: var(--s6); border-bottom: 1px solid var(--line); }
  .post-head { display: flex; align-items: baseline; gap: var(--s3); }
  .post-avatar { display: none; }
  .post-author { font-weight: 600; font-size: var(--fs-small); }
  .post-when { font-size: var(--fs-meta); color: var(--text-3); }
  .post-copy { margin-top: var(--s2); max-width: var(--measure); }
  .post-title { font-size: var(--fs-h3); }
  .post-text { margin-top: var(--s2); color: var(--text); }
  .post-text p + p { margin-top: var(--s3); }
  .feed-empty { display: none; }

  /* ---- writing (only when posts exist) ---- */
  .blog-index { list-style: none; border-top: 1px solid var(--line); }
  .bi { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s2) var(--s5); padding: var(--s4) 0; border-bottom: 1px solid var(--line); align-items: start; }
  .bi:hover .bi-title { text-decoration: underline; text-underline-offset: 3px; }
  .bi-cover { grid-column: 2; grid-row: 1 / span 3; width: 120px; height: 80px; border-radius: var(--r1); overflow: hidden; background: var(--bg-alt); }
  .bi-cover img { width: 100%; height: 100%; object-fit: cover; }
  .bi-text { display: contents; }
  .bi-meta { font-size: var(--fs-meta); color: var(--text-3); order: 1; }
  .bi-title { font-size: var(--fs-h3); font-weight: 600; order: 2; }
  .bi-ex { color: var(--text-2); font-size: var(--fs-small); max-width: var(--measure); order: 3; }
  .bi-tags { display: flex; gap: var(--s2); flex-wrap: wrap; order: 4; font-size: var(--fs-meta); color: var(--text-3); }
  .bi-tag::before { content: "#"; }
  body.reading .hero, body.reading .section { display: none; }
  .doc { padding: var(--s8) 0; }
  .doc-back { font-size: var(--fs-small); color: var(--text-2); }
  .doc-back:hover { color: var(--text); }
  .doc-cover { margin: var(--s5) 0 0; border-radius: var(--r2); overflow: hidden; max-height: 320px; }
  .doc-cover img { width: 100%; height: 100%; max-height: 320px; object-fit: cover; }
  .doc-inner { width: min(700px, 100%); margin: 0 auto; padding-top: var(--s6); }
  .doc-head { padding-bottom: var(--s5); margin-bottom: var(--s5); border-bottom: 1px solid var(--line); }
  .doc-meta { font-size: var(--fs-meta); color: var(--text-3); }
  .doc-head h1 { font-size: 32px; line-height: 1.2; margin-top: var(--s2); }
  .doc-tags { display: flex; gap: var(--s2); flex-wrap: wrap; margin-top: var(--s3); font-size: var(--fs-meta); color: var(--text-3); }
  .doc-body { font-size: var(--fs-body); line-height: 1.75; }
  .doc-body p { margin: 0 0 var(--s4); }
  .doc-body h2 { font-size: 23px; margin: var(--s7) 0 var(--s3); }
  .doc-body h3 { font-size: 19px; margin: var(--s6) 0 var(--s2); }
  .doc-body h4, .doc-body h5 { font-size: var(--fs-body); margin: var(--s5) 0 var(--s2); }
  .doc-body ul, .doc-body ol { margin: 0 0 var(--s4); padding-left: 22px; display: grid; gap: var(--s2); }

        if (da) return -1;          // dated races first

        return 0;                   // undated: keep the order they were entered
      });
      var list = races.length ? '<div class="race-list">' + races.map(renderRace).join('') + '</div>' : '';
      var expandable = /class="race-x"/.test(list);
      return renderRaceSummary(races) +
        (expandable ? '<div class="race-tools"><button type="button" class="race-toggle-all" data-open="0">' + esc(T.expandAll) + '</button></div>' : '') +
        list;
    },
    posts: function (b) {
      var list = b.posts || [];
      if (!list.length) return '<p class="feed-empty">' + esc(T.noPosts) + '</p>';
      return '<div class="feed">' + list.map(renderPost).join('') + '</div>';
    },
    cards: function (b) {
      return '<div class="cards">' + (b.cards || []).map(function (c) {
        return '<article class="mini">' +
          (c.meta ? '<div class="meta">' + esc(c.meta) + '</div>' : '') +
          '<h3>' + esc(c.title) + '</h3>' +
          (c.text ? '<p>' + rich(c.text) + '</p>' : '') +
          (c.facts && c.facts.length ? '<div class="facts num">' + c.facts.map(function (f) {
            return '<div><span>' + esc(f.label) + '</span><b>' + esc(f.value) + '</b></div>';
          }).join('') + '</div>' : '') +
          '</article>';
      }).join('') + '</div>';
    }
  };

  // One clickable tile. `index` is its position in the enclosing [data-media] gallery.
  function mediaCell(m, index, more, extra) {
    var inner = isVideo(m)
      ? '<video src="' + esc(m.src) + '" preload="metadata" playsinline muted></video><span class="play">&#9654;</span>'
      : '<img src="' + esc(m.src) + '" alt="' + esc(m.alt || '') + '" loading="lazy">';
    return '<button type="button" class="media-cell" data-index="' + index + '" aria-label="' + esc(T.openMedia(index + 1)) + '">' +
      inner + (extra || '') + (more ? '<span class="media-more">+' + more + '</span>' : '') + '</button>';
  }
  // Up to four tiles; anything beyond that folds into a +N badge on the last one.
  function mediaGrid(list, offset) {
    var shown = list.slice(0, 4);
    var more = list.length - shown.length;
    return '<div class="post-media n-' + shown.length + '">' + shown.map(function (m, i) {
      return mediaCell(m, offset + i, (i === shown.length - 1) ? more : 0);
    }).join('') + '</div>';
  }
  function galleryAttr(media) { return ' data-media="' + esc(JSON.stringify(media)) + '"'; }

  // Race photos read like a blog post: every shot in full, stacked, nothing
  // cropped and nothing hidden behind a "+3" badge.
  // Strava's photo strip: a horizontal row of photos at one shared height, each
  // keeping its own shape, several visible at once and the rest a scroll away.
  function mediaCarousel(list, offset) {
    var slides = list.map(function (m, i) {
      var inner = isVideo(m)
        ? '<video src="' + esc(m.src) + '" controls preload="metadata" playsinline></video>'
        : '<img src="' + esc(m.src) + '" alt="' + esc(m.alt || '') + '" loading="lazy">';
      var tag = isVideo(m) ? 'div' : 'button';
      return '<' + tag + ' class="slide' + (isVideo(m) ? '' : ' media-cell') + '"' +
        (isVideo(m) ? '' : ' type="button" data-index="' + (offset + i) + '"' +
          ' aria-label="Open photo ' + (i + 1) + ' full size"') + '>' +
        inner + (m.alt ? '<span class="slide-cap">' + esc(m.alt) + '</span>' : '') +
        '</' + tag + '>';
    }).join('');

    return '<div class="carousel" data-count="' + list.length + '">' +
      '<div class="track" tabindex="0">' + slides + '</div>' +
      (list.length > 1
        ? '<button type="button" class="c-nav prev" data-step="-1" aria-label="Scroll photos left">\u2039</button>' +
          '<button type="button" class="c-nav next" data-step="1" aria-label="Scroll photos right">\u203A</button>'
        : '') +
      '</div>';
  }

  function renderPost(p) {
    var who = (content && content.profile) || {};
    var author = p.author || who.name || '';
    var avatar = who.photo
      ? '<img src="' + esc(who.photo) + '" alt="" onerror="this.remove()">'
      : esc(initialsOf(author));
    var media = (p.media || []).filter(function (m) { return m && m.src; });
    var body = '';
    if (p.title) body += '<h3 class="post-title">' + esc(p.title) + '</h3>';
    if (p.body) body += '<div class="post-text">' + richBody(p.body) + '</div>';

    return '<article class="post">' +
      '<header class="post-head">' +
        '<div class="post-avatar">' + avatar + '</div>' +
        '<div class="post-who"><div class="post-author">' + esc(author) + '</div>' +
        '<div class="post-when num" title="' + esc(niceDate(p.date)) + '">' + esc(relDate(p.date)) + '</div></div>' +
      '</header>' +
      (body ? '<div class="post-copy">' + body + '</div>' : '') +
      (media.length ? '<div' + galleryAttr(media) + '>' + mediaGrid(media, 0) + '</div>' : '') +
      '</article>';
  }

  /* ---------- blog: a small Markdown subset ---------- */
  function slugify(s) {
    return String(s || '').toLowerCase().trim()
      .replace(/[^a-z0-9가-힣]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'post';
  }

  // Escape first, then stash finished HTML behind markers so later passes
  // cannot reach inside it.
  function mdInline(text) {
    var stash = [];
    var MARK = '\u0000';
    function keep(html) { return MARK + (stash.push(html) - 1) + MARK; }
    var out = esc(text);
    out = out.replace(/`([^`\n]+)`/g, function (_, code) { return keep('<code>' + code + '</code>'); });
    out = out.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, function (_, label, href) {
      var ext = /^https?:/.test(href);
      return keep('<a href="' + href + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '>' + label + '</a>');
    });
    out = out.replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]])/g, function (url) {
      return keep('<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>');
    });
    out = out.replace(/\*\*([^\n]+?)\*\*/g, '<b>$1</b>');
    out = out.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    out = out.replace(/~~([^\n]+?)~~/g, '<s>$1</s>');
    return out.replace(new RegExp(MARK + '(\\d+)' + MARK, 'g'), function (_, i) { return stash[+i]; });
  }

  // Headings, lists, quotes, code fences, rules, images and paragraphs.
  function renderDoc(body) {
    var lines = String(body || '').replace(/\r\n?/g, '\n').split('\n');
    var html = '', i = 0;

    function list(ordered, items) {
      var tag = ordered ? 'ol' : 'ul';
      return '<' + tag + '>' + items.map(function (t) { return '<li>' + mdInline(t) + '</li>'; }).join('') + '</' + tag + '>';
    }

    while (i < lines.length) {
      var line = lines[i];
      if (/^\s*$/.test(line)) { i++; continue; }

      if (/^```/.test(line)) {
        var lang = line.replace(/^```\s*/, '').trim(), code = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) { code.push(lines[i]); i++; }
        i++;
        html += '<pre' + (lang ? ' data-lang="' + esc(lang) + '"' : '') + '><code>' + esc(code.join('\n')) + '</code></pre>';
        continue;
      }

      if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) { html += '<hr>'; i++; continue; }

      var img = /^\s*!\[([^\]]*)\]\(([^)\s]+)\)\s*$/.exec(line);
      if (img) {
        html += '<figure class="doc-fig"><img src="' + esc(img[2]) + '" alt="' + esc(img[1]) + '" loading="lazy">' +
          (img[1] ? '<figcaption>' + esc(img[1]) + '</figcaption>' : '') + '</figure>';
        i++; continue;
      }

      var h = /^(#{1,4})\s+(.*)$/.exec(line);
      if (h) {
        var level = Math.min(h[1].length + 1, 5);   // '#' renders as h2; the title owns h1
        html += '<h' + level + ' id="' + esc(slugify(h[2])) + '">' + mdInline(h[2]) + '</h' + level + '>';
        i++; continue;
      }

      if (/^\s*>\s?/.test(line)) {
        var quote = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) { quote.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
        html += '<blockquote>' + mdInline(quote.join('\n')).replace(/\n/g, '<br>') + '</blockquote>';
        continue;
      }

      if (/^\s*(?:[-*+])\s+/.test(line)) {
        var ul = [];
        while (i < lines.length && /^\s*(?:[-*+])\s+/.test(lines[i])) { ul.push(lines[i].replace(/^\s*(?:[-*+])\s+/, '')); i++; }
        html += list(false, ul);
        continue;
      }

      if (/^\s*\d+[.)]\s+/.test(line)) {
        var ol = [];
        while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) { ol.push(lines[i].replace(/^\s*\d+[.)]\s+/, '')); i++; }
        html += list(true, ol);
        continue;
      }

      var para = [];
      while (i < lines.length && !/^\s*$/.test(lines[i]) &&
             !/^(#{1,4}\s|```|\s*>|\s*[-*+]\s|\s*\d+[.)]\s|\s*---+\s*$)/.test(lines[i])) {
        para.push(lines[i]); i++;
      }
      html += '<p>' + mdInline(para.join('\n')).replace(/\n/g, '<br>') + '</p>';
    }
    return html;
  }

  function postSlug(p, i) { return p.slug || slugify(p.title) || ('post-' + (i + 1)); }
  function readMinutes(body) { return T.readMinutes(body); }
  function excerptOf(p) {
    if (p.excerpt) return p.excerpt;
    var first = String(p.body || '').split(/\n{2,}/).map(function (b) { return b.trim(); })
      .filter(function (b) { return b && !/^(#|>|```|!\[|\s*[-*+]\s|\s*\d+[.)]\s|---)/.test(b); })[0] || '';
    first = first.replace(/[*`~\[\]]/g, '').replace(/\s+/g, ' ');
    return first.length > 180 ? first.slice(0, 180).replace(/\s+\S*$/, '') + '…' : first;
  }

  /* ---------- blog: index and article ---------- */
  function blogPosts(b) {
    return (b.posts || []).slice().sort(function (a, c) {
      var da = isoDate(a.date), dc = isoDate(c.date);
      if (da && dc) return da === dc ? 0 : (dc < da ? -1 : 1);
      if (da) return -1;
      if (dc) return 1;
      return 0;
    });
  }

  function renderBlogIndex(b, tabId) {
    var posts = blogPosts(b);
    if (!posts.length) return '<p class="feed-empty">' + esc(T.noArticles) + '</p>';
    return '<div class="blog-index">' + posts.map(function (p, i) {
      var slug = postSlug(p, i);
      var meta = [niceDate(p.date), T.minRead(readMinutes(p.body))].filter(Boolean).join(' · ');
      var ex = excerptOf(p);
      return '<a class="bi" href="#' + esc(tabId) + '/' + esc(slug) + '">' +
        (p.cover ? '<span class="bi-cover"><img src="' + esc(p.cover) + '" alt="" loading="lazy"></span>' : '') +
        '<span class="bi-text">' +
          '<span class="bi-meta num">' + esc(meta) + '</span>' +
          '<span class="bi-title">' + esc(p.title || T.untitled) + '</span>' +
          (ex ? '<span class="bi-ex">' + esc(ex) + '</span>' : '') +
          ((p.tags || []).length ? '<span class="bi-tags">' + p.tags.map(function (t) {
            return '<span class="bi-tag">' + esc(t) + '</span>';
          }).join('') + '</span>' : '') +
        '</span></a>';
    }).join('') + '</div>';
  }

  function renderArticle(p, i, tabId) {
    var meta = [niceDate(p.date), T.minRead(readMinutes(p.body))].filter(Boolean).join(' · ');
    return '<article class="card doc">' +
      '<a class="doc-back" href="#' + esc(tabId) + '">' + esc(T.allPosts) + '</a>' +
      (p.cover ? '<div class="doc-cover"><img src="' + esc(p.cover) + '" alt=""></div>' : '') +
      '<div class="doc-inner">' +
        '<header class="doc-head">' +
          '<div class="doc-meta num">' + esc(meta) + '</div>' +
          '<h1>' + esc(p.title || T.untitled) + '</h1>' +
          ((p.tags || []).length ? '<div class="doc-tags">' + p.tags.map(function (t) {
            return '<span class="bi-tag">' + esc(t) + '</span>';
          }).join('') + '</div>' : '') +
        '</header>' +
        '<div class="doc-body">' + renderDoc(p.body) + '</div>' +
      '</div></article>';
  }

  /* ---------- races ---------- */
  var RACE_KM = { full: 42.195, half: 21.0975, '10k': 10, '5k': 5, ultra: 0, tri: 0, hyrox: 0 };
  // Full / half / 10 km are always on the board, even at zero.
  var TALLY_ORDER = ['full', 'half', '10k', '5k', 'ultra', 'tri', 'hyrox', 'other'];
  var TALLY_ALWAYS = { full: 1, half: 1, '10k': 1 };

  function raceKind(r) { return RACE_KM.hasOwnProperty(r.distance) ? r.distance : 'other'; }
  function kindInfo(k) {
    var words = T.kinds[k] || T.kinds.other;
    return { key: k, short: words.short, one: words.one, label: words.label, name: words.name, km: RACE_KM[k] || 0 };
  }
  function raceKm(r) {
    var typed = parseFloat(r.km);
    if (typed > 0) return typed;
    return kindInfo(raceKind(r)).km || 0;
  }
  function raceDistance(r) {
    var km = raceKm(r);
    return km ? (Math.round(km * 1000) / 1000) + ' km' : kindInfo(raceKind(r)).name;
  }
  // A finish time means you ran it, so it counts as history no matter what the
  // date says. Only a dated, un-run race is still ahead of you.
  // "3:47:18" or "42:10" -> seconds.
  function durationSeconds(txt) {
    var m = /^\s*(?:(\d+):)?(\d{1,2}):(\d{1,2})\s*$/.exec(txt || '');
    if (!m) return null;
    return (m[1] ? +m[1] : 0) * 3600 + (+m[2]) * 60 + (+m[3]);
  }
  // Pace is derivable from time and distance, so a blank one is filled in rather
  // than left off the card.
  function racePace(r) {
    if (r.pace) return r.pace;
    var secs = durationSeconds(r.time), km = raceKm(r);
    if (!secs || !(km > 0)) return '';
    var per = Math.round(secs / km);
    return Math.floor(per / 60) + ':' + ('0' + (per % 60)).slice(-2);
  }
  function isUpcoming(r) {
    if (r.time || r.pace) return false;
    var iso = isoDate(r.date);
    return !!iso && iso > todayStamp();
  }
  function raceDate(r) { return isoDate(r.date) || ''; }
  function daysUntil(v) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(isoDate(v));
    if (!m) return null;
    var now = new Date(); now.setHours(0, 0, 0, 0);
    return Math.round((new Date(+m[1], +m[2] - 1, +m[3]) - now) / 86400000);
  }

  function renderRaceSummary(races) {
    var counts = {};
    races.forEach(function (r) {
      if (isUpcoming(r)) return;
      var k = raceKind(r);
      counts[k] = (counts[k] || 0) + 1;
    });
    var tally = TALLY_ORDER.filter(function (k) { return counts[k] || TALLY_ALWAYS[k]; })
      .map(function (k) {
        var n = counts[k] || 0;
        var info = kindInfo(k);
        return '<div class="tally"><span class="tally-n num">' + n + '</span>' +
               '<span class="tally-l">' + esc(n === 1 ? info.one : info.label) + '</span></div>';
      }).join('');

    var total = races.filter(function (r) { return !isUpcoming(r); }).length;
    var next = races.filter(isUpcoming).sort(function (a, b) { return raceDate(a) < raceDate(b) ? -1 : 1; })[0];

    // The board is a record of what has been run. An upcoming race only earns a
    // slot when one is actually on the calendar.
    var box = '';
    if (next) {
      var d = daysUntil(next.date);
      var away = T.away(d);
      box = '<div class="race-next"><span class="next-k">' + esc(T.nextUp) + '</span>' +
        '<span class="next-name">' + esc(next.name || T.unnamedRace) + '</span>' +
        '<span class="next-meta">' + esc(niceDate(next.date) + ' · ' + away +
          (next.location ? ' · ' + next.location : '')) + '</span></div>';
    }
    return '<div class="race-summary' + (box ? '' : ' solo') + '">' +
      '<div class="race-record"><div class="tally-head">' +
        esc(T.finished(total)) +
      '</div><div class="race-tally">' + tally + '</div></div>' + box + '</div>';
  }

  // "Full", "Half", or the actual distance for anything without a preset.
  function badgeText(r, kind) {
    if (kind.key !== 'other') return kind.short;
    var km = raceKm(r);
    return km ? (Math.round(km * 10) / 10) + ' km' : kind.short;
  }
  function renderRace(r) {
    var kind = kindInfo(raceKind(r));
    var upcoming = isUpcoming(r);
    var gallery = [];
    if (r.map) gallery.push({ type: 'image', src: r.map, alt: T.routeMapAlt + (r.name || T.unnamedRace) });
    var photos = (r.media || []).filter(function (m) { return m && m.src; });
    gallery = gallery.concat(photos);

    // The numbers live on the collapsed row, so the card stays one line tall.
    var stats = '<span class="race-stats num">' +
      '<span class="s-dist"><b>' + esc(raceDistance(r)) + '</b></span>' +
      (r.time ? '<span><b>' + esc(r.time) + '</b></span>' : '') +
      (racePace(r) ? '<span><b>' + esc(racePace(r)) + '</b><i>' + esc(T.perKm) + '</i></span>' : '') +
      '</span>';

    // Say what is inside, so a collapsed row does not hide its photos silently.
    var inside = [];
    if (r.map) inside.push(T.routeMap);
    if (photos.length) inside.push(T.photos(photos.length));
    var sub = [niceDate(r.date), r.location].filter(Boolean).concat(inside).join(' · ');
    var extras =
      (r.note ? '<div class="race-note">' + richBody(r.note) + '</div>' : '') +
      (r.map ? '<div class="race-map">' + mediaCell(gallery[0], 0, 0, '<span class="map-tag">' + esc(T.route) + '</span>') + '</div>' : '') +
      (photos.length ? mediaCarousel(photos, r.map ? 1 : 0) : '');

    var row =
      '<span class="race-badge' + (upcoming ? ' upcoming' : '') + '">' + esc(badgeText(r, kind)) + '</span>' +
      '<span class="race-id"><span class="race-name">' + esc(r.name || T.unnamedRace) + '</span>' +
      (sub ? '<span class="race-sub">' + esc(sub) + '</span>' : '') + '</span>' +
      (upcoming ? '<span class="race-flag">' + esc(T.upcoming) + '</span>' : '') +
      stats +
      (extras ? '<span class="race-chev" aria-hidden="true">\u203A</span>' : '');

    var open = '<article class="race"' + (gallery.length ? galleryAttr(gallery) : '') + '>';
    // A race with nothing extra to show is a plain row, not a dead toggle.
    if (!extras) return open + '<div class="race-row plain">' + row + '</div></article>';
    return open + '<details class="race-x"><summary class="race-row">' + row + '</summary>' +
      '<div class="race-more">' + extras + '</div></details></article>';
  }

  function renderBlock(b) {
    var fn = BLOCKS[b.type];
    if (!fn) return '';
    return '<section class="card section">' + (b.title ? '<h2>' + esc(b.title) + '</h2>' : '') + fn(b) + '</section>';
  }

  /* ---------- page ----------
     One scrolling narrative built from content.portfolio plus the existing
     blocks. activeTab survives only for the editor's preview protocol. */
  var content, activeTab, P = {};

  function tabById(id) { return (content.tabs || []).filter(function (t) { return t.id === id; })[0] || null; }
  function blocksOfType(type) {
    var out = [];
    (content.tabs || []).forEach(function (t) {
      (t.blocks || []).forEach(function (b) { if (b.type === type) out.push(b); });
    });
    return out;
  }
  function sortedRaces(list) {
    return (list || []).slice().sort(function (a, c) {
      var da = raceDate(a), dc = raceDate(c);
      if (da && dc) return da === dc ? 0 : (dc < da ? -1 : 1);
      if (da) return -1;
      if (dc) return 1;
      return 0;
    });
  }
  function paragraphs(list) {
    return (list || []).map(function (t) { return '<p>' + rich(t) + '</p>'; }).join('');
  }
  function section(id, title, body) {
    return '<section class="section" id="' + id + '" aria-labelledby="h-' + id + '"><div class="wrap">' +
      '<div class="section-head"><h2 id="h-' + id + '">' + esc(title) + '</h2></div>' +
      '<div class="section-body">' + body + '</div></div></section>';
  }
  function disclosure(label, body, cls) {
    return '<details class="disclosure' + (cls ? ' ' + cls : '') + '"><summary>' + esc(label) + '</summary>' +
      '<div class="disclosure-body' + (cls ? ' ' + cls + '-body' : '') + '">' + body + '</div></details>';
  }

  /* ---- hero: who, what, why credible, where next ---- */
  function renderHero(c) {
    var h = P.hero || {}, p = c.profile || {};
    var role = [h.role, h.location].filter(Boolean).join(' · ');
    var alt = p.nameKo && p.nameKo !== p.name ? ' <span class="alt" lang="ko">' + esc(p.nameKo) + '</span>' : '';
    return '<section class="hero" id="top" aria-labelledby="h-name"><div class="wrap">' +
      '<div>' +
        (role ? '<p class="hero-role">' + esc(role) + '</p>' : '') +
        '<h1 id="h-name">' + esc(p.name) + alt + '</h1>' +
        (h.statement ? '<p class="hero-statement">' + esc(h.statement) + '</p>' : '') +
        (h.credentials ? '<p class="hero-cred">' + esc(h.credentials) + '</p>' : '') +
        '<div class="hero-actions">' +
          (h.primary ? '<a class="btn" href="' + esc(h.primary.href) + '">' + esc(h.primary.label) + '</a>' : '') +
          (h.secondary ? '<a class="link" href="' + esc(h.secondary.href) + '">' + esc(h.secondary.label) + '</a>' : '') +
        '</div>' +
      '</div>' +
      (p.photo ? '<div class="portrait"><img src="' + esc(assetSrc(p.photo)) + '" alt="' + esc(p.name) + '" width="132" height="132" decoding="async"></div>' : '') +
      '</div></section>';
  }

  /* ---- selected work: conclusion first, detail behind a disclosure ---- */
  function renderWork() {
    var w = P.work;
    if (!w || !(w.items || []).length) return '';
    var list = w.items.map(function (it) {
      return '<li class="work-item">' +
        (it.label ? '<p class="meta">' + esc(it.label) + '</p>' : '') +
        '<h3>' + esc(it.title) + '</h3>' +
        (it.summary ? '<p class="summary">' + esc(it.summary) + '</p>' : '') +
        ((it.meta || []).length ? '<ul class="work-tags">' + it.meta.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul>' : '') +
        ((it.details || []).length ? disclosure(w.detailsLabel || 'Details',
          '<ul>' + it.details.map(function (d) { return '<li>' + rich(d) + '</li>'; }).join('') + '</ul>') : '') +
        '</li>';
    }).join('');
    return section('work', w.title, (w.intro ? '<p class="intro">' + esc(w.intro) + '</p>' : '') + '<ol class="work-list">' + list + '</ol>');
  }

  /* ---- experience: a timeline, current role dominant ---- */
  function renderRole(e, earlier) {
    var X = P.experience || {};
    var bullets = e.bullets || [];
    var lead = typeof e.lead === 'number' ? e.lead : (earlier ? 2 : 4);
    var shown = bullets.slice(0, lead), rest = bullets.slice(lead);
    var org = [e.org, e.location].filter(Boolean).join(' · ');
    var li = function (t) { return '<li>' + rich(t) + '</li>'; };
    return '<li class="role">' +
      '<div class="role-when num">' + (e.when ? '<span' + (e.current ? ' class="now"' : '') + '>' + esc(e.when) + '</span>' : '') + '</div>' +
      '<div>' +
        '<h3>' + esc(e.heading) + '</h3>' +
        (org ? '<p class="org">' + esc(org) + '</p>' : '') +
        (e.overview ? '<p class="overview">' + rich(e.overview) + '</p>' : '') +
        (shown.length ? '<ul>' + shown.map(li).join('') + '</ul>' : '') +
        (rest.length ? disclosure((X.more || 'All contributions') + ' (' + bullets.length + ')', '<ul>' + rest.map(li).join('') + '</ul>') : '') +
      '</div></li>';
  }
  function renderExperience() {
    var X = P.experience || {};
    var about = tabById('about');
    var groups = about ? about.blocks.filter(function (b) { return b.type === 'entries'; }) : [];
    var main = groups[0] ? groups[0].entries : [];
    var earlier = groups[2] ? groups[2].entries : [];
    if (!main.length) return '';
    var body = '<ol class="roles">' + main.map(function (e) { return renderRole(e, false); }).join('') + '</ol>';
    if (earlier.length) {
      body += '<p class="earlier-head">' + esc(X.earlier || 'Earlier') + '</p>' +
        '<ol class="roles earlier">' + earlier.map(function (e) { return renderRole(e, true); }).join('') + '</ol>';
    }
    return section('experience', X.title || 'Experience', body);
  }

  function renderBackground() {
    var b = P.background;
    if (!b || !(b.paragraphs || []).length) return '';
    return section('background', b.title, paragraphs(b.paragraphs));
  }

  /* ---- outside work: a curated summary; the race archive stays behind a disclosure ---- */
  function renderOutside() {
    var o = P.outside || {};
    var rb = blocksOfType('races')[0];
    var races = rb ? (rb.races || []) : [];
    var done = races.filter(function (r) { return !isUpcoming(r); });
    function best(kind) {
      return done.filter(function (r) { return r.distance === kind && durationSeconds(r.time); })
        .sort(function (a, b) { return durationSeconds(a.time) - durationSeconds(b.time); })[0] || null;
    }
    var full = best('full'), half = best('half');
    function fact(k, v, sub) {
      return '<div><dt>' + esc(k) + '</dt><dd class="num">' + esc(v) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</dd></div>';
    }
    var facts = '';
    if (done.length) facts += fact(o.finished || 'Races finished', String(done.length));
    if (full) facts += fact(o.bestFull || 'Marathon', full.time, [full.name, niceDate(full.date)].filter(Boolean).join(' · '));
    if (half) facts += fact(o.bestHalf || 'Half marathon', half.time, [half.name, niceDate(half.date)].filter(Boolean).join(' · '));
    if (o.goal) facts += fact(o.goalLabel || 'Current goal', o.goal);

    var body = paragraphs(o.paragraphs);
    if (facts) body += '<dl class="facts">' + facts + '</dl>';
    if (races.length) {
      var expandable = races.some(function (r) { return r.note || r.map || (r.media || []).length; });
      body += disclosure((o.archive || 'Race archive') + ' (' + races.length + ')',
        (expandable ? '<div class="race-tools"><button type="button" class="race-toggle-all" data-open="0">' + esc(T.expandAll) + '</button></div>' : '') +
        '<div class="race-list">' + sortedRaces(races).map(renderRace).join('') + '</div>', 'archive');
    }
    if (!body) return '';
    return section('outside', o.title || 'Outside work', body);
  }

  /* ---- education and credentials: compact rows ---- */
  function renderEducation() {
    var ed = P.education || {};
    var about = tabById('about'), study = tabById('study');
    var groups = about ? about.blocks.filter(function (b) { return b.type === 'entries'; }) : [];
    var schools = groups[1] ? groups[1].entries : [];
    var certTable = study ? study.blocks.filter(function (b) { return b.type === 'table'; })[0] : null;
    var certs = certTable ? (certTable.rows || []) : [];
    function row(k, main, subs) {
      return '<li><span class="k num">' + esc(k) + '</span><span class="v"><b>' + esc(main) + '</b>' +
        subs.filter(Boolean).map(function (s) { return '<br><span class="sub">' + esc(s) + '</span>'; }).join('') + '</span></li>';
    }
    var rows = schools.map(function (e) { return row(e.when || '', e.heading, [e.org, e.location]); });
    certs.forEach(function (r) { rows.push(row(r.tag || '', r.name, [r.text])); });
    if (ed.tools) rows.push('<li><span class="k">' + esc(ed.toolsLabel || 'Technical') + '</span><span class="v">' + esc(ed.tools) + '</span></li>');
    if (ed.finance) rows.push('<li><span class="k">' + esc(ed.financeLabel || 'Finance') + '</span><span class="v">' + esc(ed.finance) + '</span></li>');
    if (!rows.length) return '';
    return section('education', ed.title || 'Education', '<ul class="rows">' + rows.join('') + '</ul>');
  }

  /* ---- updates and writing appear only once something is published ---- */
  function renderUpdates() {
    var posts = [];
    blocksOfType('posts').forEach(function (b) { (b.posts || []).forEach(function (p) { posts.push(p); }); });
    if (!posts.length) return '';
    posts.sort(function (a, b) { var da = isoDate(a.date), db = isoDate(b.date); return da === db ? 0 : (db < da ? -1 : 1); });
    return section('updates', (P.nav || {}).updates || 'Updates', '<div class="feed">' + posts.map(renderPost).join('') + '</div>');
  }
  function writingBlock() {
    return blocksOfType('blog').filter(function (b) { return (b.posts || []).length; })[0] || null;
  }
  function renderWriting() {
    var b = writingBlock();
    if (!b) return '';
    return section('writing', (P.nav || {}).writing || 'Writing', renderBlogIndex(b, 'writing'));
  }

  /* ---- contact: verified links only ---- */
  function renderContact(c) {
    var k = P.contact || {};
    var list = (c.profile && c.profile.contact) || [];
    var email = list.filter(function (x) { return /^mailto:/i.test(x.href || ''); })[0];
    // TODO(content): the LinkedIn entry in content.js points at linkedin.com's homepage, not a
    // profile. It stays hidden until the href is a real https://www.linkedin.com/in/... URL.
    var linkedin = list.filter(function (x) { return /linkedin\.com\/in\/[^/?#]+/i.test(x.href || ''); })[0];
    var items = '';
    if (email) {
      items += '<li><span class="k">' + esc(k.emailLabel || 'Email') + '</span>' +
        '<a href="' + esc(email.href) + '">' + esc(email.value || email.href.replace(/^mailto:/i, '')) + '</a></li>';
    }
    if (linkedin) {
      items += '<li><span class="k">' + esc(k.linkedinLabel || 'LinkedIn') + '</span>' +
        '<a href="' + esc(linkedin.href) + '" target="_blank" rel="noopener">' + esc(linkedin.value || linkedin.href) + '</a></li>';
    }
    return section('contact', k.title || 'Contact',
      (k.lead ? '<p>' + esc(k.lead) + '</p>' : '') + (items ? '<ul class="contact-list">' + items + '</ul>' : ''));
  }

  /* ---- navigation: one link per section that exists, current one marked ---- */
  function renderNav() {
    var N = P.nav || {};
    var links = [];
    Array.prototype.forEach.call(el('sections').querySelectorAll('section.section[id]'), function (s) {
      var id = s.id, label = N[id];
      if (!label) return;
      links.push('<a href="#' + id + '">' + esc(label) + '</a>');
    });
    el('nav').innerHTML = links.join('');
  }
  var spy = null;
  function observeSections() {
    if (spy) spy.disconnect();
    if (!('IntersectionObserver' in window)) return;
    var links = el('nav').querySelectorAll('a');
    function mark(id) {
      Array.prototype.forEach.call(links, function (a) {
        if (a.getAttribute('href') === '#' + id) a.setAttribute('aria-current', 'true');
        else a.removeAttribute('aria-current');
      });
    }
    spy = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) mark(en.target.id); });
    }, { rootMargin: '-45% 0px -50% 0px', threshold: 0 });
    Array.prototype.forEach.call(el('sections').querySelectorAll('section.section[id]'), function (s) { spy.observe(s); });
  }

  // Small-screen menu.
  var menuBtn = el('menu-btn'), nav = el('nav');
  function setMenu(open) {
    nav.classList.toggle('open', open);
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  menuBtn.addEventListener('click', function () { setMenu(!nav.classList.contains('open')); });
  nav.addEventListener('click', function (e) { if (e.target.closest('a')) setMenu(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && nav.classList.contains('open')) { setMenu(false); menuBtn.focus(); } });
  document.addEventListener('click', function (e) {
    if (nav.classList.contains('open') && !e.target.closest('.site-header')) setMenu(false);
  });

  /* ---- routing: plain anchors scroll natively; only articles need help ---- */
  function show(hash) {
    var parts = String(hash || '').replace(/^#/, '').split('/');
    var id = parts[0], slug = parts.slice(1).join('/');
    var article = el('article');
    if (id === 'writing' && slug) {
      var b = writingBlock(), opened = null;
      if (b) blogPosts(b).forEach(function (p, i) { if (!opened && postSlug(p, i) === slug) opened = renderArticle(p, i, 'writing'); });
      if (opened) {
        article.innerHTML = '<div class="wrap">' + opened + '</div>';
        article.hidden = false;
        document.body.classList.add('reading');
        window.scrollTo({ top: 0 });
        return;
      }
    }
    if (!article.hidden) {
      article.hidden = true;
      article.innerHTML = '';
      document.body.classList.remove('reading');
      var target = id && document.getElementById(id);
      if (target) target.scrollIntoView();
    }
  }

  function renderAll(c, l) {
    applyLang(l || lang);
    content = c;
    P = c.portfolio || (window.SITE_CONTENT && window.SITE_CONTENT.portfolio) || {};
    var N = P.nav || {};
    document.title = c.site.title || document.title;
    var desc = document.querySelector('meta[name="description"]');
    if (desc && c.site.description) desc.setAttribute('content', c.site.description);
    var og = document.querySelector('meta[property="og:description"]');
    if (og && c.site.description) og.setAttribute('content', c.site.description);
    el('brand').textContent = c.site.brand || c.site.title || '';
    el('skip').textContent = N.skip || 'Skip to content';
    menuBtn.textContent = N.menu || 'Menu';

    el('sections').innerHTML =
      renderHero(c) + renderWork() + renderExperience() + renderBackground() +
      renderOutside() + renderEducation() + renderUpdates() + renderWriting() + renderContact(c);
    renderNav();
    el('footer').innerHTML = '<span>' + esc(c.site.footer || '') + '</span>' +
      (c.site.footerNote ? '<span>' + esc(c.site.footerNote) + '</span>' : '');
    initCarousels();
    observeSections();
    show(location.hash);
  }

  // ENG / 한국어: remember the choice and redraw in place.
  function setLang(l) {
    if (l === lang && content === contentFor(l)) return;
    try { localStorage.setItem(LANG_KEY, l); } catch (e) { /* ignore */ }
    if (document.body.classList.contains('reading')) history.replaceState(null, '', '#writing');
    renderAll(contentFor(l), l);
  }
  el('lang').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-lang]');
    if (btn) setLang(btn.dataset.lang);
  });

  window.addEventListener('hashchange', function () { show(location.hash); });

  // The header only draws its rule once the page has moved under it.
  var header = document.querySelector('.site-header');
  function syncHeader() { header.classList.toggle('scrolled', window.scrollY > 4); }
  window.addEventListener('scroll', syncHeader, { passive: true });
  syncHeader();

  el('brand').addEventListener('click', function (e) {
    e.preventDefault();
    if (document.body.classList.contains('reading')) history.replaceState(null, '', '#writing');
    show('');
    window.scrollTo({ top: 0 });
    history.replaceState(null, '', location.pathname + location.search);
  });

  // Live preview: admin.html posts draft content into this frame.
  var PREVIEW_SECTION = { about: 'experience', study: 'education', hobbies: 'outside', blogs: 'writing' };
  var isPreview = /[?&]preview=1/.test(location.search);
  if (isPreview) {
    el('lang').hidden = true;
    window.addEventListener('message', function (e) {
      if (e.data && e.data.type === 'site-content' && e.data.content) {
        activeTab = e.data.tab || activeTab;
        PREVIEW_ASSETS = e.data.assets || {};
        renderAll(e.data.content, e.data.lang || lang);
        var target = activeTab && document.getElementById(PREVIEW_SECTION[activeTab] || activeTab);
        if (target) target.scrollIntoView();
      }
    });
  }

  /* ---------- lightbox ---------- */
  var lb = el('lightbox'), lbGallery = [], lbIndex = 0;

  function lbRender() {
    var m = lbGallery[lbIndex];
    if (!m) return;
    el('lb-figure').innerHTML = (isVideo(m)
        ? '<video src="' + esc(m.src) + '" controls autoplay playsinline></video>'
        : '<img src="' + esc(m.src) + '" alt="' + esc(m.alt || '') + '">') +
      (m.alt ? '<figcaption>' + esc(m.alt) + '</figcaption>' : '');
    var many = lbGallery.length > 1;
    el('lb-count').textContent = many ? (lbIndex + 1) + ' / ' + lbGallery.length : '';
    el('lb-prev').hidden = !many;
    el('lb-next').hidden = !many;
    el('lb-rail').innerHTML = many ? lbGallery.map(function (g, i) {
      var thumb = isVideo(g)
        ? '<video src="' + esc(g.src) + '" preload="metadata" muted playsinline></video>'
        : '<img src="' + esc(g.src) + '" alt="" loading="lazy">';
      return '<button type="button" data-jump="' + i + '" aria-current="' + (i === lbIndex) + '" ' +
        'aria-label="' + esc(T.showMedia(i + 1)) + '">' + thumb + '</button>';
    }).join('') : '';
  }
  function lbOpen(gallery, i) {
    lbGallery = gallery; lbIndex = i;
    lb.hidden = false; lb.classList.add('open');
    document.body.style.overflow = 'hidden';
    lbRender();
    requestAnimationFrame(function () { lb.classList.add('shown'); });
    el('lb-close').focus();
  }
  function lbClose() {
    lb.classList.remove('shown');
    setTimeout(function () {
      lb.classList.remove('open'); lb.hidden = true;
      el('lb-figure').innerHTML = '';
      el('lb-rail').innerHTML = '';
    }, 180);
    document.body.style.overflow = '';
  }
  function lbStep(d) { lbIndex = (lbIndex + d + lbGallery.length) % lbGallery.length; lbRender(); }

  el('lb-close').addEventListener('click', lbClose);
  el('lb-prev').addEventListener('click', function () { lbStep(-1); });
  el('lb-next').addEventListener('click', function () { lbStep(1); });
  lb.addEventListener('click', function (e) {
    var jump = e.target.closest('[data-jump]');
    if (jump) { lbIndex = parseInt(jump.dataset.jump, 10); lbRender(); return; }
    if (e.target === lb || e.target.classList.contains('lb-stage')) lbClose();
  });
  document.addEventListener('keydown', function (e) {
    if (lb.hidden) return;
    if (e.key === 'Escape') lbClose();
    else if (e.key === 'ArrowRight') lbStep(1);
    else if (e.key === 'ArrowLeft') lbStep(-1);
  });

  /* ---------- photo carousels ---------- */
  // The strip scrolls freely, so the arrows just report whether there is more
  // to either side, and hide altogether when everything already fits.
  function syncCarousel(box) {
    var track = box.querySelector('.track');
    if (!track) return;
    var max = track.scrollWidth - track.clientWidth;
    // Snapping rests the first photo against the track's padding, not at 0, so the
    // "already at the start" test has to allow for it.
    var pad = parseFloat(getComputedStyle(track).paddingLeft) || 0;
    var prev = box.querySelector('.c-nav.prev'), next = box.querySelector('.c-nav.next');
    if (prev) prev.disabled = track.scrollLeft <= pad + 2;
    if (next) next.disabled = track.scrollLeft >= max - 2;
    box.classList.toggle('fits', max <= pad + 2);
  }
  function scrollStep(track) { return Math.max(160, Math.round(track.clientWidth * 0.8)); }

  // scroll does not bubble, so listen in the capture phase.
  el('main').addEventListener('scroll', function (e) {
    var track = e.target;
    if (track && track.classList && track.classList.contains('track')) syncCarousel(track.parentElement);
  }, true);

  el('main').addEventListener('click', function (e) {
    var nav = e.target.closest('.c-nav');
    if (!nav) return;
    e.preventDefault();
    var track = nav.closest('.carousel').querySelector('.track');
    track.scrollBy({ left: parseInt(nav.dataset.step, 10) * scrollStep(track), behavior: 'smooth' });
  });

  el('main').addEventListener('keydown', function (e) {
    var track = e.target;
    if (!track.classList || !track.classList.contains('track')) return;
    var step = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (!step) return;
    e.preventDefault();
    track.scrollBy({ left: step * scrollStep(track), behavior: 'smooth' });
  });

  // Fresh markup starts with the arrows in the right state.
  function initCarousels() {
    Array.prototype.forEach.call(el('main').querySelectorAll('.carousel[data-count]'), function (box) {
      syncCarousel(box);
      // Widths only exist once each photo knows its own shape.
      Array.prototype.forEach.call(box.querySelectorAll('img'), function (img) {
        if (img.complete) return;
        img.addEventListener('load', function () { syncCarousel(box); }, { once: true });
      });
    });
  }
  window.addEventListener('resize', initCarousels);

  // Expand all / collapse all for the race list.
  el('main').addEventListener('click', function (e) {
    var toggle = e.target.closest('.race-toggle-all');
    if (!toggle) return;
    var opening = toggle.dataset.open !== '1';
    var scope = toggle.closest('.section') || document;
    Array.prototype.forEach.call(scope.querySelectorAll('details.race-x'), function (d) { d.open = opening; });
    initCarousels();
    toggle.dataset.open = opening ? '1' : '0';
    toggle.textContent = opening ? T.collapseAll : T.expandAll;
  });

  el('main').addEventListener('click', function (e) {
    var cell = e.target.closest('.media-cell');
    if (!cell) return;
    var wrap = cell.closest('[data-media]');
    var gallery;
    try { gallery = JSON.parse(wrap.dataset.media); } catch (err) { return; }
    lbOpen(gallery, parseInt(cell.dataset.index, 10) || 0);
  });

  var startLang = initialLang();
  renderAll(contentFor(startLang), startLang);
})();
</script>

</body>
</html>
