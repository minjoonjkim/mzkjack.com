<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minjoon Jack Kim</title>
<meta name="description" content="Minjoon Jack Kim — computer science and statistics student at Penn State, robotics transformation consultant intern at RLWRLD, CFA Level II candidate, endurance athlete.">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<style>
  /* ---------- Tokens (RLWRLD brand, softened for screen) ---------- */
  :root {
    color-scheme: light;
    --white: #FFFFFF;
    --black: #0B0C0E;
    --primary: #57EBDE;        /* mint end of the theme gradient */
    --primary-2: #AEFB2A;      /* lime end */
    --grad: linear-gradient(90deg, #57EBDE, #AEFB2A);
    --primary-text: #0B7F69;   /* teal, text-safe on white (4.9:1) */
    --primary-tint: #EAFDF3;   /* mint-lime tint for chips and highlights */
    --on-primary: #06392F;     /* text placed on the accent itself */
    --bg: #F1F2F4;
    --bolder: #E4E6E9;         /* card borders */
    --line-soft: #EDEFF1;      /* inner dividers */
    --slate: #2F333A;          /* body text */
    --dim: #5E6570;            /* secondary */
    --gray: #8A919B;           /* tertiary */

    --h1: 27px; --h1-lh: 1.28;
    --h2: 17px; --h2-lh: 1.5;
    --p: 13px;  --p-lh: 1.62;
    --small: 11px;

    --max: 1220px;
    --radius: 12px;
    --radius-sm: 8px;
    --sh-1: 0 1px 2px rgba(16, 24, 40, 0.05);
    --sh-2: 0 3px 10px rgba(16, 24, 40, 0.06), 0 1px 2px rgba(16, 24, 40, 0.04);
    --sh-3: 0 18px 44px rgba(16, 24, 40, 0.18);
    --ease: cubic-bezier(0.2, 0.8, 0.25, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { min-width: 320px; scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--slate);
    font-family: "Helvetica Neue", Helvetica, Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-size: var(--p);
    line-height: var(--p-lh);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--primary-text); outline-offset: 2px; border-radius: 3px; }
  h1 { font-size: var(--h1); line-height: var(--h1-lh); font-weight: 700; color: var(--black); letter-spacing: -0.015em; text-wrap: balance; }
  h2 { font-size: var(--h2); line-height: var(--h2-lh); font-weight: 700; color: var(--black); letter-spacing: -0.01em; }
  h3 { font-size: 14px; line-height: 1.45; font-weight: 700; color: var(--black); letter-spacing: -0.005em; }
  .num { font-variant-numeric: tabular-nums; }
  b { font-weight: 700; color: var(--black); }
  /* Bullets and numbers are black everywhere; the accent is for chips and rules. */
  li::marker { color: var(--black); }

  .shell { width: min(var(--max), calc(100% - 40px)); margin: 0 auto; }

  /* ---------- Header ---------- */
  .site-header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: saturate(180%) blur(16px);
    -webkit-backdrop-filter: saturate(180%) blur(16px);
    border-bottom: 1px solid transparent;
    transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease), background 0.25s var(--ease);
  }
  .site-header.scrolled { border-bottom-color: var(--bolder); box-shadow: 0 1px 12px rgba(16, 24, 40, 0.05); }
  .site-header .shell { min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .brand {
    font-family: "Helvetica Neue", Helvetica, Arial, "Lucida Grande", "DejaVu Sans", "Segoe UI Symbol", sans-serif;
    font-weight: 700; color: var(--black); white-space: nowrap;
    display: inline-flex; align-items: center; gap: 9px; font-size: 14px; letter-spacing: 0.01em;
  }
  .brand::before {
    content: ""; width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto;
    background: var(--grad); box-shadow: 0 0 0 3px var(--primary-tint);
    transition: transform 0.35s var(--ease);
  }
  .brand:hover::before { transform: rotate(45deg) scale(1.1); }

  .tabs { position: relative; display: flex; gap: 2px; }
  .tab {
    appearance: none; background: none; border: 0; cursor: pointer; position: relative;
    font: inherit; color: var(--dim); font-size: 13px; font-weight: 500;
    padding: 19px 13px 17px; border-radius: 8px 8px 0 0;
    transition: color 0.2s var(--ease), background 0.2s var(--ease);
  }
  .tab:hover { color: var(--black); background: rgba(11, 12, 14, 0.035); }
  .tab[aria-selected="true"] { color: var(--black); font-weight: 700; }
  .tab-ink {
    position: absolute; left: 0; bottom: 0; height: 2px; width: 0;
    background: var(--grad); border-radius: 2px 2px 0 0; pointer-events: none;
    transition: transform 0.34s var(--ease), width 0.34s var(--ease);
  }
  .lang-switch {
    display: inline-flex; flex: 0 0 auto; padding: 2px; border-radius: 999px;
    border: 1px solid var(--bolder); background: var(--white);
  }
  .lang-switch button {
    appearance: none; border: 0; background: none; cursor: pointer; font: inherit;
    font-size: 11px; font-weight: 700; letter-spacing: 0.03em; color: var(--dim);
    padding: 3px 10px; border-radius: 999px; line-height: 1.4;
    transition: color 0.18s var(--ease), background 0.18s var(--ease);
  }
  .lang-switch button:hover { color: var(--black); }
  .lang-switch[hidden] { display: none; }
  .lang-switch button[aria-pressed="true"] { background: var(--black); color: var(--white); }

  /* ---------- Layout ---------- */
  main.shell { flex: 1; padding: 22px 0 40px; }
  .cv-grid { display: grid; grid-template-columns: minmax(255px, 300px) 1fr; gap: 20px; align-items: start; }
  .card { background: var(--white); border: 1px solid var(--bolder); border-radius: var(--radius); box-shadow: var(--sh-1); }

  /* ---------- Profile panel ---------- */
  .profile { padding: 0; overflow: hidden; position: sticky; top: 74px; }
  .profile-cover {
    height: 96px; position: relative;
    background-size: cover; background-position: center; background-repeat: no-repeat;
  }
  .profile-cover::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(120% 140% at 82% -20%, rgba(255,255,255,0.45), transparent 60%);
  }
  /* A wallpaper replaces the gradient; the scrim keeps the card edge readable. */
  .profile-cover.has-image::after {
    background: linear-gradient(to bottom, rgba(0, 0, 0, 0.18) 0%, rgba(0, 0, 0, 0) 42%, rgba(0, 0, 0, 0.3) 100%);
  }
  .cover-mint     { background-color: #57EBDE; background-image: var(--grad); }
  .cover-midnight { background-color: #1B2A4A; background-image: linear-gradient(115deg, #2E4B7C 0%, #1B2A4A 55%, #0B1220 100%); }
  .cover-sand     { background-color: #E4C79B; background-image: linear-gradient(115deg, #F6E3C3 0%, #E4C79B 50%, #B98A55 100%); }
  .cover-slate    { background-color: #55606F; background-image: linear-gradient(115deg, #8894A6 0%, #55606F 55%, #2C333D 100%); }
  .cover-plum     { background-color: #6B3F7A; background-image: linear-gradient(115deg, #B57BC6 0%, #6B3F7A 55%, #3A1F45 100%); }
  .cover-sunrise  { background-color: #F08A5D; background-image: linear-gradient(115deg, #FFC978 0%, #F08A5D 50%, #C6417A 100%); }
  .cover-ink      { background-color: #14161A; background-image: linear-gradient(115deg, #3A3F49 0%, #14161A 60%, #0B0C0E 100%); }
  .profile-body { padding: 0 18px 16px; display: flex; flex-direction: column; gap: 10px; }
  .portrait {
    width: 84px; aspect-ratio: 1; border-radius: 50%; overflow: hidden; margin-top: -40px;
    border: 3px solid var(--white); background: var(--bg); box-shadow: var(--sh-2);
    display: grid; place-items: center; position: relative;
  }
  .portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .portrait img[data-missing] { display: none; }
  .portrait .placeholder { display: none; text-align: center; color: var(--gray); font-size: 10px; line-height: 1.3; padding: 6px; }
  .portrait .placeholder b { display: block; font-size: 24px; color: var(--dim); font-weight: 700; }
  .portrait.is-empty .placeholder { display: block; }
  .identity h1 { font-size: 20px; line-height: 1.2; }
  .identity p { color: var(--dim); font-size: 13px; margin-top: 1px; }
  .roles { display: grid; gap: 2px; color: var(--dim); }
  .roles span { padding-left: 13px; position: relative; }
  .roles span::before { content: ""; position: absolute; left: 0; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--primary); }
  .separator { height: 1px; background: var(--line-soft); }
  .contact { display: grid; gap: 9px; }
  .contact dt { font-size: 10px; font-weight: 700; color: var(--gray); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1px; }
  .contact dd { color: var(--slate); word-break: break-word; white-space: pre-line; }
  .contact dd a { border-bottom: 1px solid var(--bolder); transition: color 0.18s var(--ease), border-color 0.18s var(--ease); }
  .contact dd a:hover { color: var(--primary-text); border-color: var(--primary-text); }
  .contact .lines { display: grid; gap: 5px; }
  .contact .line { display: flex; align-items: center; gap: 8px; padding: 5px 9px; border: 1px solid var(--bolder);
                   border-radius: var(--radius-sm); background: var(--white); white-space: normal; }
  .contact .line .ico { width: 20px; height: 20px; flex: 0 0 auto; border-radius: 4px; object-fit: contain; background: var(--line-soft); }
  .contact .line .ico[data-missing] { display: none; }
  .contact .line .txt { min-width: 0; word-break: break-word; white-space: pre-line; }
  .contact .line a { border-bottom: 1px solid var(--bolder); }
  .contact .line a:hover { color: var(--primary-text); border-color: var(--primary-text); }
  .focus-head { font-size: 10px; font-weight: 700; color: var(--gray); text-transform: uppercase; letter-spacing: 0.08em; padding-top: 10px; border-top: 1px solid var(--line-soft); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; list-style: none; }
  .chips li {
    padding: 3px 9px; border-radius: 999px; background: var(--primary-tint); color: var(--primary-text);
    font-size: var(--small); line-height: 1.45; font-weight: 500;
    transition: transform 0.18s var(--ease);
  }
  .chips li:hover { transform: translateY(-1px); }

  /* ---------- Main column ---------- */
  .cv-main { display: grid; gap: 12px; min-width: 0; }
  .section { padding: 18px 20px; transition: box-shadow 0.25s var(--ease); }
  .section > h2 { display: flex; align-items: center; gap: 12px; margin-bottom: 13px; }
  .section > h2::after { content: ""; flex: 1 1 auto; height: 1px; background: var(--line-soft); }
  .section-lead { color: var(--slate); }
  .section-lead p + p { margin-top: 8px; }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .cv-main > * { animation: rise 0.28s var(--ease) both; }
  .cv-main > *:nth-child(2) { animation-delay: 0.03s; }
  .cv-main > *:nth-child(3) { animation-delay: 0.06s; }
  .cv-main > *:nth-child(n+4) { animation-delay: 0.09s; }

  .entries { display: grid; gap: 18px; }
  .entry { display: grid; gap: 4px; }
  .entry-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 20px; }
  .entry .when { color: var(--gray); white-space: nowrap; font-size: 12px; }
  .entry .when.current { color: var(--primary-text); font-weight: 700; }
  .entry .when.current::before {
    content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--primary); margin-right: 7px; vertical-align: 1px;
    box-shadow: 0 0 0 0 rgba(80, 234, 206, 0.7); animation: pulse 2.4s ease-out infinite;
  }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(80,234,206,0.75); } 70% { box-shadow: 0 0 0 7px rgba(80,234,206,0); } 100% { box-shadow: 0 0 0 0 rgba(80,234,206,0); } }
  .entry .org { color: var(--dim); }
  .entry .org .sep { color: var(--gray); margin: 0 7px; }
  .entry ul { margin-top: 5px; padding-left: 17px; display: grid; gap: 5px; color: var(--slate); }

  .table { width: 100%; border-collapse: collapse; }
  .table tr { border-bottom: 1px solid var(--line-soft); }
  .table tr:last-child { border-bottom: 0; }
  .table th, .table td { text-align: left; vertical-align: top; padding: 11px 0; }
  .table th { font-weight: 700; color: var(--black); width: 158px; padding-right: 18px; }
  .table td { color: var(--slate); }
  .table .tag { display: inline-block; margin-top: 4px; color: var(--primary-text); background: var(--primary-tint); border-radius: 4px; padding: 1px 7px; font-size: 10px; font-weight: 700; letter-spacing: 0.03em; }

  /* Coursework: grouped by department, one row per course */
  .courses { display: grid; gap: 16px; }
  .course-dept { color: var(--gray); font-size: var(--small); text-transform: uppercase; letter-spacing: 0.07em; font-weight: 700; padding-bottom: 4px; border-bottom: 1px solid var(--line-soft); }
  .course-list { display: grid; }
  .course { display: grid; grid-template-columns: 112px 1fr; gap: 3px 14px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
  .course:last-child { border-bottom: 0; padding-bottom: 2px; }
  .course .code { font-weight: 700; color: var(--primary-text); white-space: nowrap; }
  .course h3 { font-size: 14px; font-weight: 700; color: var(--black); }
  .course p { grid-column: 2; color: var(--slate); }

  .skills { display: grid; gap: 12px; }
  .skill-row { display: grid; grid-template-columns: 112px 1fr; gap: 10px; align-items: baseline; }
  .skill-row dt { color: var(--gray); font-size: var(--small); text-transform: uppercase; letter-spacing: 0.07em; font-weight: 700; }
  .skill-row .chips li { background: #F4F5F7; color: var(--slate); border-radius: 5px; }

  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .stat { border: 1px solid var(--line-soft); border-top: 3px solid transparent; border-image: var(--grad) 1; border-image-width: 3px 0 0 0; border-radius: var(--radius-sm); padding: 12px 14px; background: #FFF; }
  .stat .value { font-size: 22px; line-height: 1.2; font-weight: 700; color: var(--black); letter-spacing: -0.02em; }
  .stat .label { color: var(--dim); font-size: var(--small); margin-top: 2px; }

  .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .mini {
    border: 1px solid var(--line-soft); border-radius: var(--radius-sm); padding: 14px; display: grid; gap: 6px; align-content: start;
    transition: border-color 0.22s var(--ease), box-shadow 0.22s var(--ease), transform 0.22s var(--ease);
  }
  .mini:hover { border-color: var(--primary); box-shadow: var(--sh-2); transform: translateY(-2px); }
  .mini .meta { color: var(--primary-text); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
  .mini .facts { display: grid; gap: 3px; margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--line-soft); color: var(--dim); font-size: var(--small); }
  .mini .facts div { display: flex; justify-content: space-between; gap: 12px; }
  .mini .facts b { color: var(--slate); }

  /* ---------- Feed / posts ---------- */
  .feed { display: grid; gap: 12px; }
  .feed-empty { color: var(--gray); }
  .post {
    border: 1px solid var(--bolder); border-radius: var(--radius); background: var(--white); overflow: hidden;
    transition: box-shadow 0.25s var(--ease), border-color 0.25s var(--ease);
  }
  .post:hover { box-shadow: var(--sh-2); border-color: #D8DBDF; }
  .post-head { display: flex; align-items: center; gap: 10px; padding: 13px 15px 0; }
  .post-avatar {
    width: 34px; height: 34px; border-radius: 50%; overflow: hidden; flex: 0 0 auto;
    background: var(--primary-tint); color: var(--primary-text); display: grid; place-items: center;
    font-weight: 700; font-size: var(--small); box-shadow: 0 0 0 2px var(--white), 0 0 0 3px var(--line-soft);
  }
  .post-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .post-who { min-width: 0; line-height: 1.35; }
  .post-author { font-weight: 700; color: var(--black); }
  .post-when { color: var(--gray); font-size: var(--small); }
  .post-copy { padding: 10px 15px 13px; display: grid; gap: 5px; }
  .post-copy:last-child { padding-bottom: 15px; }
  .post-title { font-size: 15px; }
  .post-text { color: var(--slate); }
  .post-text p + p { margin-top: 7px; }
  .post-text a { color: var(--primary-text); border-bottom: 1px solid rgba(11, 127, 105, 0.3); transition: border-color 0.18s var(--ease); }
  .post-text a:hover { border-color: var(--primary-text); }

  .post-media { display: grid; gap: 2px; background: var(--bolder); border-top: 1px solid var(--bolder); }
  .post-media.n-1 { grid-template-columns: 1fr; }
  .post-media.n-2, .post-media.n-4 { grid-template-columns: 1fr 1fr; }
  .post-media.n-3 { grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; }
  .post-media.n-3 .media-cell:first-child { grid-row: span 2; max-height: 502px; }
  .media-cell {
    position: relative; margin: 0; padding: 0; border: 0; display: block; width: 100%;
    background: #0E1012; aspect-ratio: 4 / 3; max-height: 250px; overflow: hidden; cursor: zoom-in;
  }
  .post-media.n-1 .media-cell { aspect-ratio: 16 / 10; max-height: 430px; }
  .media-cell img, .media-cell video { width: 100%; height: 100%; display: block; object-fit: cover; transition: transform 0.5s var(--ease), opacity 0.3s var(--ease); }
  .post-media.n-1 .media-cell img, .post-media.n-1 .media-cell video { object-fit: contain; }
  .media-cell:hover img, .media-cell:hover video { transform: scale(1.035); }
  .media-cell::after {
    content: ""; position: absolute; inset: 0; background: rgba(11, 12, 14, 0); transition: background 0.25s var(--ease);
  }
  .media-cell:hover::after { background: rgba(11, 12, 14, 0.08); }
  .media-cell .play {
    position: absolute; inset: 0; margin: auto; width: 48px; height: 48px; border-radius: 50%;
    background: rgba(11, 12, 14, 0.55); backdrop-filter: blur(4px); color: #fff;
    display: grid; place-items: center; font-size: 15px; padding-left: 3px; pointer-events: none; z-index: 1;
    transition: transform 0.25s var(--ease), background 0.25s var(--ease);
  }
  .media-cell:hover .play { transform: scale(1.08); background: rgba(11, 12, 14, 0.72); }
  .media-more {
    position: absolute; inset: 0; background: rgba(11, 12, 14, 0.52); backdrop-filter: blur(2px);
    color: #fff; display: grid; place-items: center; font-size: 21px; font-weight: 700; z-index: 1;
  }

  /* ---------- Races ---------- */
  .race-summary {
    display: grid; grid-template-columns: 1fr auto; gap: 14px 24px; align-items: center;
    border: 1px solid var(--bolder); border-radius: var(--radius); padding: 12px 15px; margin-bottom: 10px;
    background: linear-gradient(135deg, #FFFFFF 0%, #F6FEF6 100%);
  }
  .race-summary.solo { grid-template-columns: 1fr; }
  .race-record { display: grid; gap: 9px; min-width: 0; }
  .tally-head {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: var(--gray);
    display: flex; align-items: center; gap: 10px;
  }
  .tally-head::after { content: ""; flex: 1 1 auto; height: 1px; background: var(--line-soft); }
  .race-tally { display: flex; flex-wrap: wrap; gap: 10px 28px; }
  .tally { display: grid; gap: 1px; }
  .tally-n { font-size: 21px; line-height: 1.1; font-weight: 700; color: var(--black); letter-spacing: -0.02em; }
  .tally-l { color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
  .race-next {
    display: grid; gap: 1px; padding: 10px 14px; border-radius: var(--radius-sm);
    background: var(--primary-tint); border: 1px solid rgba(80, 234, 206, 0.5); min-width: 190px;
  }
  .race-next .next-k { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; color: var(--primary-text); }
  .race-next .next-name { font-weight: 700; color: var(--black); }
  .race-next .next-meta { color: var(--primary-text); font-size: var(--small); }
  .race-next.none .next-name { color: var(--dim); font-weight: 400; }

  .race-list { display: grid; gap: 6px; }
  .race {
    border: 1px solid var(--bolder); border-radius: var(--radius); background: var(--white); overflow: hidden;
    transition: box-shadow 0.25s var(--ease), border-color 0.25s var(--ease);
  }
  .race:hover { box-shadow: var(--sh-2); border-color: #D8DBDF; }
  .race-tools { display: flex; justify-content: flex-end; margin: -3px 0 7px; }
  .race-toggle-all {
    appearance: none; border: 1px solid var(--bolder); background: var(--white); cursor: pointer;
    font: inherit; font-size: var(--small); font-weight: 700; color: var(--dim);
    border-radius: 999px; padding: 3px 12px;
    transition: color 0.18s var(--ease), border-color 0.18s var(--ease), box-shadow 0.18s var(--ease);
  }
  .race-toggle-all:hover { color: var(--black); border-color: var(--primary); box-shadow: var(--sh-1); }

  .race-row {
    display: flex; align-items: center; gap: 9px; padding: 5px 11px; cursor: pointer;
    list-style: none; -webkit-tap-highlight-color: transparent;
    transition: background 0.18s var(--ease);
  }
  .race-row::-webkit-details-marker { display: none; }
  .race-row::marker { content: ""; }
  .race-row:hover { background: #FAFBFC; }
  .race-row.plain { cursor: default; }
  .race-row.plain:hover { background: none; }
  .race-chev {

  }
  function galleryAttr(media) { return ' data-media="' + esc(JSON.stringify(media)) + '"'; }

  // Race photos read like a blog post: every shot in full, stacked, nothing
  // cropped and nothing hidden behind a "+3" badge.
  // Strava's photo strip: a horizontal row of photos at one shared height, each
  // keeping its own shape, several visible at once and the rest a scroll away.
  function mediaCarousel(list, offset) {
    var slides = list.map(function (m, i) {
      var inner = isVideo(m)
        ? '<video src="' + esc(m.src) + '" controls preload="metadata" playsinline></video>'
        : '<img src="' + esc(m.src) + '" alt="' + esc(m.alt || '') + '" loading="lazy">';
      var tag = isVideo(m) ? 'div' : 'button';
      return '<' + tag + ' class="slide' + (isVideo(m) ? '' : ' media-cell') + '"' +
        (isVideo(m) ? '' : ' type="button" data-index="' + (offset + i) + '"' +
          ' aria-label="Open photo ' + (i + 1) + ' full size"') + '>' +
        inner + (m.alt ? '<span class="slide-cap">' + esc(m.alt) + '</span>' : '') +
        '</' + tag + '>';
    }).join('');

    return '<div class="carousel" data-count="' + list.length + '">' +
      '<div class="track" tabindex="0">' + slides + '</div>' +
      (list.length > 1
        ? '<button type="button" class="c-nav prev" data-step="-1" aria-label="Scroll photos left">\u2039</button>' +
          '<button type="button" class="c-nav next" data-step="1" aria-label="Scroll photos right">\u203A</button>'
        : '') +
      '</div>';
  }

  function renderPost(p) {
    var who = (content && content.profile) || {};
    var author = p.author || who.name || '';
    var avatar = who.photo
      ? '<img src="' + esc(who.photo) + '" alt="" onerror="this.remove()">'
      : esc(initialsOf(author));
    var media = (p.media || []).filter(function (m) { return m && m.src; });
    var body = '';
    if (p.title) body += '<h3 class="post-title">' + esc(p.title) + '</h3>';
    if (p.body) body += '<div class="post-text">' + richBody(p.body) + '</div>';

    return '<article class="post">' +
      '<header class="post-head">' +
        '<div class="post-avatar">' + avatar + '</div>' +
        '<div class="post-who"><div class="post-author">' + esc(author) + '</div>' +
        '<div class="post-when num" title="' + esc(niceDate(p.date)) + '">' + esc(relDate(p.date)) + '</div></div>' +
      '</header>' +
      (body ? '<div class="post-copy">' + body + '</div>' : '') +
      (media.length ? '<div' + galleryAttr(media) + '>' + mediaGrid(media, 0) + '</div>' : '') +
      '</article>';
  }

  /* ---------- blog: a small Markdown subset ---------- */
  function slugify(s) {
    return String(s || '').toLowerCase().trim()
      .replace(/[^a-z0-9가-힣]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'post';
  }

  // Escape first, then stash finished HTML behind markers so later passes
  // cannot reach inside it.
  function mdInline(text) {
    var stash = [];
    var MARK = '\u0000';
    function keep(html) { return MARK + (stash.push(html) - 1) + MARK; }
    var out = esc(text);
    out = out.replace(/`([^`\n]+)`/g, function (_, code) { return keep('<code>' + code + '</code>'); });
    out = out.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, function (_, label, href) {
      var ext = /^https?:/.test(href);
      return keep('<a href="' + href + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '>' + label + '</a>');
    });
    out = out.replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]])/g, function (url) {
      return keep('<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>');
    });
    out = out.replace(/\*\*([^\n]+?)\*\*/g, '<b>$1</b>');
    out = out.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    out = out.replace(/~~([^\n]+?)~~/g, '<s>$1</s>');
    return out.replace(new RegExp(MARK + '(\\d+)' + MARK, 'g'), function (_, i) { return stash[+i]; });
  }

  // Headings, lists, quotes, code fences, rules, images and paragraphs.
  function renderDoc(body) {
    var lines = String(body || '').replace(/\r\n?/g, '\n').split('\n');
    var html = '', i = 0;

    function list(ordered, items) {
      var tag = ordered ? 'ol' : 'ul';
      return '<' + tag + '>' + items.map(function (t) { return '<li>' + mdInline(t) + '</li>'; }).join('') + '</' + tag + '>';
    }

    while (i < lines.length) {
      var line = lines[i];
      if (/^\s*$/.test(line)) { i++; continue; }

      if (/^```/.test(line)) {
        var lang = line.replace(/^```\s*/, '').trim(), code = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) { code.push(lines[i]); i++; }
        i++;
        html += '<pre' + (lang ? ' data-lang="' + esc(lang) + '"' : '') + '><code>' + esc(code.join('\n')) + '</code></pre>';
        continue;
      }

      if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) { html += '<hr>'; i++; continue; }

      var img = /^\s*!\[([^\]]*)\]\(([^)\s]+)\)\s*$/.exec(line);
      if (img) {
        html += '<figure class="doc-fig"><img src="' + esc(img[2]) + '" alt="' + esc(img[1]) + '" loading="lazy">' +
          (img[1] ? '<figcaption>' + esc(img[1]) + '</figcaption>' : '') + '</figure>';
        i++; continue;
      }

      var h = /^(#{1,4})\s+(.*)$/.exec(line);
      if (h) {
        var level = Math.min(h[1].length + 1, 5);   // '#' renders as h2; the title owns h1
        html += '<h' + level + ' id="' + esc(slugify(h[2])) + '">' + mdInline(h[2]) + '</h' + level + '>';
        i++; continue;
      }

      if (/^\s*>\s?/.test(line)) {
        var quote = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) { quote.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
        html += '<blockquote>' + mdInline(quote.join('\n')).replace(/\n/g, '<br>') + '</blockquote>';
        continue;
      }

      if (/^\s*(?:[-*+])\s+/.test(line)) {
        var ul = [];
        while (i < lines.length && /^\s*(?:[-*+])\s+/.test(lines[i])) { ul.push(lines[i].replace(/^\s*(?:[-*+])\s+/, '')); i++; }
        html += list(false, ul);
        continue;
      }

      if (/^\s*\d+[.)]\s+/.test(line)) {
        var ol = [];
        while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) { ol.push(lines[i].replace(/^\s*\d+[.)]\s+/, '')); i++; }
        html += list(true, ol);
        continue;
      }

      var para = [];
      while (i < lines.length && !/^\s*$/.test(lines[i]) &&
             !/^(#{1,4}\s|```|\s*>|\s*[-*+]\s|\s*\d+[.)]\s|\s*---+\s*$)/.test(lines[i])) {
        para.push(lines[i]); i++;
      }
      html += '<p>' + mdInline(para.join('\n')).replace(/\n/g, '<br>') + '</p>';
    }
    return html;
  }

  function postSlug(p, i) { return p.slug || slugify(p.title) || ('post-' + (i + 1)); }
  function readMinutes(body) { return T.readMinutes(body); }
  function excerptOf(p) {
    if (p.excerpt) return p.excerpt;
    var first = String(p.body || '').split(/\n{2,}/).map(function (b) { return b.trim(); })
      .filter(function (b) { return b && !/^(#|>|```|!\[|\s*[-*+]\s|\s*\d+[.)]\s|---)/.test(b); })[0] || '';
    first = first.replace(/[*`~\[\]]/g, '').replace(/\s+/g, ' ');
    return first.length > 180 ? first.slice(0, 180).replace(/\s+\S*$/, '') + '…' : first;
  }

  /* ---------- blog: index and article ---------- */
  function blogPosts(b) {
    return (b.posts || []).slice().sort(function (a, c) {
      var da = isoDate(a.date), dc = isoDate(c.date);
      if (da && dc) return da === dc ? 0 : (dc < da ? -1 : 1);
      if (da) return -1;
      if (dc) return 1;
      return 0;
    });
  }

  function renderBlogIndex(b, tabId) {
    var posts = blogPosts(b);
    if (!posts.length) return '<p class="feed-empty">' + esc(T.noArticles) + '</p>';
    return '<div class="blog-index">' + posts.map(function (p, i) {
      var slug = postSlug(p, i);
      var meta = [niceDate(p.date), T.minRead(readMinutes(p.body))].filter(Boolean).join(' · ');
      var ex = excerptOf(p);
      return '<a class="bi" href="#' + esc(tabId) + '/' + esc(slug) + '">' +
        (p.cover ? '<span class="bi-cover"><img src="' + esc(p.cover) + '" alt="" loading="lazy"></span>' : '') +
        '<span class="bi-text">' +
          '<span class="bi-meta num">' + esc(meta) + '</span>' +
          '<span class="bi-title">' + esc(p.title || T.untitled) + '</span>' +
          (ex ? '<span class="bi-ex">' + esc(ex) + '</span>' : '') +
          ((p.tags || []).length ? '<span class="bi-tags">' + p.tags.map(function (t) {
            return '<span class="bi-tag">' + esc(t) + '</span>';
          }).join('') + '</span>' : '') +
        '</span></a>';
    }).join('') + '</div>';
  }

  function renderArticle(p, i, tabId) {
    var meta = [niceDate(p.date), T.minRead(readMinutes(p.body))].filter(Boolean).join(' · ');
    return '<article class="card doc">' +
      '<a class="doc-back" href="#' + esc(tabId) + '">' + esc(T.allPosts) + '</a>' +
      (p.cover ? '<div class="doc-cover"><img src="' + esc(p.cover) + '" alt=""></div>' : '') +
      '<div class="doc-inner">' +
        '<header class="doc-head">' +
          '<div class="doc-meta num">' + esc(meta) + '</div>' +
          '<h1>' + esc(p.title || T.untitled) + '</h1>' +
          ((p.tags || []).length ? '<div class="doc-tags">' + p.tags.map(function (t) {
            return '<span class="bi-tag">' + esc(t) + '</span>';
          }).join('') + '</div>' : '') +
        '</header>' +
        '<div class="doc-body">' + renderDoc(p.body) + '</div>' +
      '</div></article>';
  }

  /* ---------- races ---------- */
  var RACE_KM = { full: 42.195, half: 21.0975, '10k': 10, '5k': 5, ultra: 0, trail: 0, tri: 0, hyrox: 0 };
  // Full / half / 10 km are always on the board, even at zero.
  var TALLY_ORDER = ['full', 'half', '10k', '5k', 'ultra', 'trail', 'tri', 'hyrox', 'other'];
  var TALLY_ALWAYS = { full: 1, half: 1, '10k': 1 };

  function raceKind(r) { return RACE_KM.hasOwnProperty(r.distance) ? r.distance : 'other'; }
  function kindInfo(k) {
    var words = T.kinds[k] || T.kinds.other;
    return { key: k, short: words.short, one: words.one, label: words.label, name: words.name, km: RACE_KM[k] || 0 };
  }
  // A race off the preset list is counted under its own distance -- a 20 km run
  // is "20 km" on the board, not one more anonymous "other".
  function tallyKey(r) {
    var k = raceKind(r);
    if (k !== 'other') return k;
    var km = raceKm(r);
    return km ? 'km:' + (Math.round(km * 1000) / 1000) : 'other';
  }
  function tallyInfo(key) {
    if (key.indexOf('km:') !== 0) return kindInfo(key);
    var km = key.slice(3);
    var words = T.kmKind(km);
    return { key: key, short: words.short, one: words.one, label: words.label, name: words.name, km: +km };
  }
  function raceKm(r) {
    var typed = parseFloat(r.km);
    if (typed > 0) return typed;
    return kindInfo(raceKind(r)).km || 0;
  }
  function raceDistance(r) {
    var km = raceKm(r);
    return km ? (Math.round(km * 1000) / 1000) + ' km' : kindInfo(raceKind(r)).name;
  }
  // A finish time means you ran it, so it counts as history no matter what the
  // date says. Only a dated, un-run race is still ahead of you.
  // "3:47:18" or "42:10" -> seconds.
  function durationSeconds(txt) {
    var m = /^\s*(?:(\d+):)?(\d{1,2}):(\d{1,2})\s*$/.exec(txt || '');
    if (!m) return null;
    return (m[1] ? +m[1] : 0) * 3600 + (+m[2]) * 60 + (+m[3]);
  }
  // Pace is derivable from time and distance, so a blank one is filled in rather
  // than left off the card.
  function racePace(r) {
    if (r.pace) return r.pace;
    var secs = durationSeconds(r.time), km = raceKm(r);
    if (!secs || !(km > 0)) return '';
    var per = Math.round(secs / km);
    return Math.floor(per / 60) + ':' + ('0' + (per % 60)).slice(-2);
  }
  function isUpcoming(r) {
    if (r.time || r.pace) return false;
    var iso = isoDate(r.date);
    return !!iso && iso > todayStamp();
  }
  function raceDate(r) { return isoDate(r.date) || ''; }
  function daysUntil(v) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(isoDate(v));
    if (!m) return null;
    var now = new Date(); now.setHours(0, 0, 0, 0);
    return Math.round((new Date(+m[1], +m[2] - 1, +m[3]) - now) / 86400000);
  }

  function renderRaceSummary(races) {
    var counts = {};
    races.forEach(function (r) {
      if (isUpcoming(r)) return;
      var k = tallyKey(r);
      counts[k] = (counts[k] || 0) + 1;
    });
    // Custom distances take the slot the catch-all used to hold, longest first.
    var custom = Object.keys(counts).filter(function (k) { return k.indexOf('km:') === 0; })
      .sort(function (a, b) { return parseFloat(b.slice(3)) - parseFloat(a.slice(3)); });
    var order = [];
    TALLY_ORDER.forEach(function (k) {
      if (k === 'other') order = order.concat(custom);
      order.push(k);
    });
    var tally = order.filter(function (k) { return counts[k] || TALLY_ALWAYS[k]; })
      .map(function (k) {
        var n = counts[k] || 0;
        var info = tallyInfo(k);
        return '<div class="tally"><span class="tally-n num">' + n + '</span>' +
               '<span class="tally-l">' + esc(n === 1 ? info.one : info.label) + '</span></div>';
      }).join('');

    var total = races.filter(function (r) { return !isUpcoming(r); }).length;
    var next = races.filter(isUpcoming).sort(function (a, b) { return raceDate(a) < raceDate(b) ? -1 : 1; })[0];

    // The board is a record of what has been run. An upcoming race only earns a
    // slot when one is actually on the calendar.
    var box = '';
    if (next) {
      var d = daysUntil(next.date);
      var away = T.away(d);
      box = '<div class="race-next"><span class="next-k">' + esc(T.nextUp) + '</span>' +
        '<span class="next-name">' + esc(next.name || T.unnamedRace) + '</span>' +
        '<span class="next-meta">' + esc(niceDate(next.date) + ' · ' + away +
          (next.location ? ' · ' + next.location : '')) + '</span></div>';
    }
    return '<div class="race-summary' + (box ? '' : ' solo') + '">' +
      '<div class="race-record"><div class="tally-head">' +
        esc(T.finished(total)) +
      '</div><div class="race-tally">' + tally + '</div></div>' + box + '</div>';
  }

  // "Full", "Half", or the actual distance for anything without a preset.
  function badgeText(r, kind) {
    if (kind.key !== 'other') return kind.short;
    var km = raceKm(r);
    return km ? (Math.round(km * 10) / 10) + ' km' : kind.short;
  }
  function renderRace(r) {
    var kind = kindInfo(raceKind(r));
    var upcoming = isUpcoming(r);
    var gallery = [];
    if (r.map) gallery.push({ type: 'image', src: r.map, alt: T.routeMapAlt + (r.name || T.unnamedRace) });
    var photos = (r.media || []).filter(function (m) { return m && m.src; });
    gallery = gallery.concat(photos);

    // The numbers live on the collapsed row, so the card stays one line tall.
    var stats = '<span class="race-stats num">' +
      '<span class="s-dist"><b>' + esc(raceDistance(r)) + '</b></span>' +
      (r.time ? '<span><b>' + esc(r.time) + '</b></span>' : '') +
      (racePace(r) ? '<span><b>' + esc(racePace(r)) + '</b><i>' + esc(T.perKm) + '</i></span>' : '') +
      '</span>';

    // Say what is inside, so a collapsed row does not hide its photos silently.
    var inside = [];
    if (r.map) inside.push(T.routeMap);
    if (photos.length) inside.push(T.photos(photos.length));
    var sub = [niceDate(r.date), r.location].filter(Boolean).concat(inside).join(' · ');
    var extras =
      (r.note ? '<div class="race-note">' + richBody(r.note) + '</div>' : '') +
      (r.map ? '<div class="race-map">' + mediaCell(gallery[0], 0, 0, '<span class="map-tag">' + esc(T.route) + '</span>') + '</div>' : '') +
      (photos.length ? mediaCarousel(photos, r.map ? 1 : 0) : '');

    var row =
      '<span class="race-badge' + (upcoming ? ' upcoming' : '') + '">' + esc(badgeText(r, kind)) + '</span>' +
      '<span class="race-id"><span class="race-name">' + esc(r.name || T.unnamedRace) + '</span>' +
      (sub ? '<span class="race-sub">' + esc(sub) + '</span>' : '') + '</span>' +
      (upcoming ? '<span class="race-flag">' + esc(T.upcoming) + '</span>' : '') +
      stats +
      (extras ? '<span class="race-chev" aria-hidden="true">\u203A</span>' : '');

    var open = '<article class="race"' + (gallery.length ? galleryAttr(gallery) : '') + '>';
    // A race with nothing extra to show is a plain row, not a dead toggle.
    if (!extras) return open + '<div class="race-row plain">' + row + '</div></article>';
    return open + '<details class="race-x"><summary class="race-row">' + row + '</summary>' +
      '<div class="race-more">' + extras + '</div></details></article>';
  }

  function renderBlock(b) {
    var fn = BLOCKS[b.type];
    if (!fn) return '';
    return '<section class="card section">' + (b.title ? '<h2>' + esc(b.title) + '</h2>' : '') + fn(b) + '</section>';
  }

  /* ---------- tabs ---------- */
  var content, activeTab;

  function tabButtons() { return el('tabs').querySelectorAll('.tab'); }

  // Slides the mint underline to whichever tab is selected.
  function moveInk() {
    var on = el('tabs').querySelector('.tab[aria-selected="true"]');
    var ink = el('tab-ink');
    if (!on || !ink) return;
    ink.style.width = on.offsetWidth + 'px';
    ink.style.transform = 'translateX(' + on.offsetLeft + 'px)';
  }

  function renderTabs() {
    el('tabs').innerHTML = content.tabs.map(function (t) {
      return '<button class="tab" role="tab" id="tab-' + esc(t.id) + '" data-tab="' + esc(t.id) + '" aria-selected="false">' + esc(t.label) + '</button>';
    }).join('') + '<span class="tab-ink" id="tab-ink" aria-hidden="true"></span>';
    Array.prototype.forEach.call(tabButtons(), function (btn, i, all) {
      btn.addEventListener('click', function () { show(btn.dataset.tab, true); });
      btn.addEventListener('keydown', function (e) {
        var j = i;
        if (e.key === 'ArrowRight') j = (i + 1) % all.length;
        else if (e.key === 'ArrowLeft') j = (i - 1 + all.length) % all.length;
        else return;
        e.preventDefault(); all[j].focus(); show(all[j].dataset.tab, true);
      });
    });
  }

  // The hash is either "#tab" or "#tab/post-slug".
  function show(id, push) {
    // Browsers hand back location.hash percent-encoded, so a Korean slug such as
    // "ontology-란-무엇인가" arrives as %EB%9E%80…; decode before matching.
    var raw = String(id == null ? '' : id);
    try { raw = decodeURIComponent(raw); } catch (e) { /* keep as typed */ }
    var parts = raw.split('/');
    var tab = content.tabs.filter(function (t) { return t.id === parts[0]; })[0] || content.tabs[0];
    var slug = parts.length > 1 ? parts.slice(1).join('/') : '';
    activeTab = tab.id;
    Array.prototype.forEach.call(tabButtons(), function (btn) {
      var on = btn.dataset.tab === tab.id;
      btn.setAttribute('aria-selected', on ? 'true' : 'false');
      btn.tabIndex = on ? 0 : -1;
    });
    moveInk();
    el('main').setAttribute('aria-labelledby', 'tab-' + tab.id);

    // A slug opens that one article in place of the tab's usual sections.
    var opened = null;
    if (slug) {
      tab.blocks.forEach(function (b) {
        if (b.type !== 'blog' || opened) return;
        blogPosts(b).forEach(function (p, i) {
          if (!opened && postSlug(p, i) === slug) opened = renderArticle(p, i, tab.id);
        });
      });
    }
    el('main').innerHTML = opened || tab.blocks.map(renderBlock).join('');
    // Reading an article gets the full width; the CV sidebar steps aside.
    document.body.classList.toggle('reading', !!opened);
    // On narrow screens the profile card shows on the first tab only.
    document.body.classList.toggle('off-home', tab !== content.tabs[0]);
    initCarousels();

    var want = '#' + tab.id + (opened ? '/' + slug : '');
    if (push && location.hash !== want) history.replaceState(null, '', want);
    if (push || opened) window.scrollTo({ top: 0 });
  }

  function renderAll(c, l) {
    applyLang(l || lang);
    content = c;
    applyTheme((c.site && c.site.theme) || (window.SITE_CONTENT && window.SITE_CONTENT.site && window.SITE_CONTENT.site.theme) || null);
    document.title = c.site.title || document.title;
    var desc = document.querySelector('meta[name="description"]');
    if (desc && c.site.description) desc.setAttribute('content', c.site.description);
    el('brand').textContent = c.site.brand || c.site.title || '';
    renderProfile(c.profile);
    renderTabs();
    el('footer').innerHTML = '<span>' + esc(c.site.footer) + '</span>' +
      '<span class="footer-right">' + (c.site.footerNote ? '<span>' + esc(c.site.footerNote) + '</span>' : '') +
      '<a class="edit-link" href="admin.html" rel="nofollow">' + esc(T.edit) + '</a></span>';
    show(activeTab || location.hash.slice(1) || c.tabs[0].id, false);
  }

  // ENG / 한국어: remember the choice and redraw the page in place.
  function setLang(l) {
    if (l === lang && content === contentFor(l)) return;
    try { localStorage.setItem(LANG_KEY, l); } catch (e) { /* ignore */ }
    var wasReading = document.body.classList.contains('reading');
    // Article slugs are per language, so a switch mid-article goes back to that tab.
    if (wasReading) history.replaceState(null, '', '#' + activeTab);
    renderAll(contentFor(l), l);
  }
  el('lang').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-lang]');
    if (btn) setLang(btn.dataset.lang);
  });

  window.addEventListener('hashchange', function () { show(location.hash.slice(1), false); });
  window.addEventListener('resize', moveInk);

  // The header only grows a shadow once the page has moved under it.
  var header = document.querySelector('.site-header');
  function syncHeader() { header.classList.toggle('scrolled', window.scrollY > 4); }
  window.addEventListener('scroll', syncHeader, { passive: true });
  syncHeader();

  // Brand click -> home (first tab), scrolled to top.
  el('brand').addEventListener('click', function (e) {
    e.preventDefault();
    var home = content && content.tabs && content.tabs[0] ? content.tabs[0].id : 'about';
    show(home, true);
    if (location.hash !== '#' + home) history.replaceState(null, '', '#' + home);
    window.scrollTo({ top: 0 });
  });

  // Live preview: admin.html posts draft content into this frame.
  var isPreview = /[?&]preview=1/.test(location.search);
  if (isPreview) {
    el('lang').hidden = true;
    window.addEventListener('message', function (e) {
      if (e.data && e.data.type === 'site-content' && e.data.content) {
        if (e.data.tab) activeTab = e.data.tab;
        PREVIEW_ASSETS = e.data.assets || {};
        renderAll(e.data.content, e.data.lang || lang);
      }
    });
  }

  /* ---------- lightbox ---------- */
  var lb = el('lightbox'), lbGallery = [], lbIndex = 0;

  function lbRender() {
    var m = lbGallery[lbIndex];
    if (!m) return;
    el('lb-figure').innerHTML = (isVideo(m)
        ? '<video src="' + esc(m.src) + '" controls autoplay playsinline></video>'
        : '<img src="' + esc(m.src) + '" alt="' + esc(m.alt || '') + '">') +
      (m.alt ? '<figcaption>' + esc(m.alt) + '</figcaption>' : '');
    var many = lbGallery.length > 1;
    el('lb-count').textContent = many ? (lbIndex + 1) + ' / ' + lbGallery.length : '';
    el('lb-prev').hidden = !many;
    el('lb-next').hidden = !many;
    el('lb-rail').innerHTML = many ? lbGallery.map(function (g, i) {
      var thumb = isVideo(g)
        ? '<video src="' + esc(g.src) + '" preload="metadata" muted playsinline></video>'
        : '<img src="' + esc(g.src) + '" alt="" loading="lazy">';
      return '<button type="button" data-jump="' + i + '" aria-current="' + (i === lbIndex) + '" ' +
        'aria-label="' + esc(T.showMedia(i + 1)) + '">' + thumb + '</button>';
    }).join('') : '';
  }
  function lbOpen(gallery, i) {
    lbGallery = gallery; lbIndex = i;
    lb.hidden = false; lb.classList.add('open');
    document.body.style.overflow = 'hidden';
    lbRender();
    requestAnimationFrame(function () { lb.classList.add('shown'); });
    el('lb-close').focus();
  }
  function lbClose() {
    lb.classList.remove('shown');
    setTimeout(function () {
      lb.classList.remove('open'); lb.hidden = true;
      el('lb-figure').innerHTML = '';
      el('lb-rail').innerHTML = '';
    }, 180);
    document.body.style.overflow = '';
  }
  function lbStep(d) { lbIndex = (lbIndex + d + lbGallery.length) % lbGallery.length; lbRender(); }

  el('lb-close').addEventListener('click', lbClose);
  el('lb-prev').addEventListener('click', function () { lbStep(-1); });
  el('lb-next').addEventListener('click', function () { lbStep(1); });
  lb.addEventListener('click', function (e) {
    var jump = e.target.closest('[data-jump]');
    if (jump) { lbIndex = parseInt(jump.dataset.jump, 10); lbRender(); return; }
    if (e.target === lb || e.target.classList.contains('lb-stage')) lbClose();
  });
  document.addEventListener('keydown', function (e) {
    if (lb.hidden) return;
    if (e.key === 'Escape') lbClose();
    else if (e.key === 'ArrowRight') lbStep(1);
    else if (e.key === 'ArrowLeft') lbStep(-1);
  });

  /* ---------- photo carousels ---------- */
  // The strip scrolls freely, so the arrows just report whether there is more
  // to either side, and hide altogether when everything already fits.
  function syncCarousel(box) {
    var track = box.querySelector('.track');
    if (!track) return;
    var max = track.scrollWidth - track.clientWidth;
    // Snapping rests the first photo against the track's padding, not at 0, so the
    // "already at the start" test has to allow for it.
    var pad = parseFloat(getComputedStyle(track).paddingLeft) || 0;
    var prev = box.querySelector('.c-nav.prev'), next = box.querySelector('.c-nav.next');
    if (prev) prev.disabled = track.scrollLeft <= pad + 2;
    if (next) next.disabled = track.scrollLeft >= max - 2;
    box.classList.toggle('fits', max <= pad + 2);
  }
  function scrollStep(track) { return Math.max(160, Math.round(track.clientWidth * 0.8)); }

  // scroll does not bubble, so listen in the capture phase.
  el('main').addEventListener('scroll', function (e) {
    var track = e.target;
    if (track && track.classList && track.classList.contains('track')) syncCarousel(track.parentElement);
  }, true);

  el('main').addEventListener('click', function (e) {
    var nav = e.target.closest('.c-nav');
    if (!nav) return;
    e.preventDefault();
    var track = nav.closest('.carousel').querySelector('.track');
    track.scrollBy({ left: parseInt(nav.dataset.step, 10) * scrollStep(track), behavior: 'smooth' });
  });

  el('main').addEventListener('keydown', function (e) {
    var track = e.target;
    if (!track.classList || !track.classList.contains('track')) return;
    var step = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (!step) return;
    e.preventDefault();
    track.scrollBy({ left: step * scrollStep(track), behavior: 'smooth' });
  });

  // Fresh markup starts with the arrows in the right state.
  function initCarousels() {
    Array.prototype.forEach.call(el('main').querySelectorAll('.carousel[data-count]'), function (box) {
      syncCarousel(box);
      // Widths only exist once each photo knows its own shape.
      Array.prototype.forEach.call(box.querySelectorAll('img'), function (img) {
        if (img.complete) return;
        img.addEventListener('load', function () { syncCarousel(box); }, { once: true });
      });
    });
  }
  window.addEventListener('resize', initCarousels);

  // Expand all / collapse all for the race list.
  el('main').addEventListener('click', function (e) {
    var toggle = e.target.closest('.race-toggle-all');
    if (!toggle) return;
    var opening = toggle.dataset.open !== '1';
    var scope = toggle.closest('.section') || document;
    Array.prototype.forEach.call(scope.querySelectorAll('details.race-x'), function (d) { d.open = opening; });
    initCarousels();
    toggle.dataset.open = opening ? '1' : '0';
    toggle.textContent = opening ? T.collapseAll : T.expandAll;
  });

  el('main').addEventListener('click', function (e) {
    var cell = e.target.closest('.media-cell');
    if (!cell) return;
    var wrap = cell.closest('[data-media]');
    var gallery;
    try { gallery = JSON.parse(wrap.dataset.media); } catch (err) { return; }
    lbOpen(gallery, parseInt(cell.dataset.index, 10) || 0);
  });

  var startLang = initialLang();
  renderAll(contentFor(startLang), startLang);
})();
</script>

</body>
</html>
